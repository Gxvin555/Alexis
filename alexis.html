/* ---- Tokens ---- */
:root{
  /* Accent: Alexis amber, the only per-app values */
  --brand:#D99A32; --brand-dark:#B27E29; --brand-tint:rgba(217,154,50,.12); --on-brand:#15202b;
  --accent-glow:rgba(217,154,50,.18);
  /* Amber as text or a focus outline on light surfaces needs more depth to stay legible */
  --brand-text:#8a5c12; --focus:#B27E29;
  /* Status, theme independent hues */
  --status-red:#e0455a; --status-red-bg:#fbdfe2; --status-red-fg:#b8283a;
  --status-amber:#d98a2b; --status-amber-bg:#f7e3c4; --status-amber-fg:#8a5410;
  --status-green:#2f9e58; --status-green-bg:#d7f0de; --status-green-fg:#1f6f3d;
  /* Scale */
  --radius-xs:8px; --radius-sm:12px; --radius-md:16px; --radius-lg:20px; --radius-xl:26px;
  --shadow-1:0 1px 2px rgba(20,20,50,.04),0 2px 8px rgba(20,20,50,.05);
  --shadow-2:0 4px 14px rgba(20,20,50,.08),0 12px 30px rgba(20,20,50,.07);
  --shadow-3:0 14px 36px rgba(20,20,50,.14),0 28px 64px rgba(20,20,50,.16);
  --ease:cubic-bezier(.2,.7,.2,1);
  --font:"Century Gothic",CenturyGothic,AppleGothic,"Poppins",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --sidebar-w:232px; --topbar-h:64px; --gutter:28px; --content-max:1240px;
  /* Light surfaces */
  --bg-app:#f4f5fa; --bg-panel:#fff; --bg-panel-2:#f7f7fc; --bg-card:#fff;
  --bg-sidebar:#0c141c; --bg-topbar:#fff; --topbar-bg:rgba(255,255,255,.82);
  --text-1:#141524; --text-2:#494c63; --text-muted:#6f7288;
  --text-on-dark:#f3f4ff; --text-on-dark-muted:#a9abc4;
  --border:#dcdde9; --border-soft:#ecedf5; --input-bg:#fff; --input-border:#dfe0ec;
  --row-hover:#f4f4fb; --scrim:rgba(10,8,24,.42);
  color-scheme:light;
}
body.dark{
  --accent-glow:rgba(217,154,50,.32); --brand-text:#D99A32; --focus:#D99A32;
  --bg-app:#101720; --bg-panel:#19212a; --bg-panel-2:#1e2731; --bg-card:#19212a;
  --bg-sidebar:#0b1118; --bg-topbar:#121a23; --topbar-bg:rgba(18,26,35,.82);
  --text-1:#eaf1f8; --text-2:#aab6c4; --text-muted:#7a8794;
  --text-on-dark:#eaf1f8; --text-on-dark-muted:#9aa7b4;
  --border:#27323d; --border-soft:#1d262f; --input-bg:#1e2731; --input-border:#2a3540;
  --row-hover:#202a34; --scrim:rgba(3,6,10,.6);
  --status-red-bg:#3a1620; --status-amber-bg:#3a2c12; --status-green-bg:#123a22;
  --status-red-fg:#f18a9b; --status-amber-fg:#efb668; --status-green-fg:#5fd189;
  color-scheme:dark;
}

/* ---- Base ---- */
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg-app)}
html:has(body.dark){background:#101720}
html,body{margin:0;min-height:100%}
body{background:var(--bg-app);color:var(--text-1);font-family:var(--font);font-size:14.5px;font-weight:500;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
h1,h2,h3,h4{margin:0;color:var(--text-1);font-weight:800;letter-spacing:-.01em}
b,strong{font-weight:700}
p{margin:0}
small{font-size:12px}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
a{color:var(--brand-text)}
.hidden{display:none!important}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.ic{width:18px;height:18px;flex:0 0 auto;display:block}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible,label.secondary:focus-within{outline:2.5px solid var(--focus);outline-offset:2px}
*{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-thumb{border:2px solid transparent;border-radius:999px;background:var(--border);background-clip:padding-box}
.positive{color:var(--status-green-fg)!important}
.negative{color:var(--status-red-fg)!important}

/* ---- Buttons ---- */
.primary,.secondary,.danger{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border:1px solid transparent;border-radius:var(--radius-sm);font-size:13.5px;font-weight:700;line-height:1.2;text-align:center;text-decoration:none;white-space:nowrap;transition:background .14s var(--ease),border-color .14s var(--ease),box-shadow .14s var(--ease),color .14s var(--ease)}
.primary svg,.secondary svg,.danger svg{width:16px;height:16px}
.primary{background:var(--brand);color:var(--on-brand)}
.primary:hover{background:var(--brand-dark)}
.secondary{background:var(--bg-card);color:var(--text-1);border-color:var(--border)}
.secondary:hover{border-color:var(--brand);background:var(--row-hover)}
label.secondary{cursor:pointer}
.danger{background:var(--status-red-bg);color:var(--status-red-fg);border-color:transparent}
.danger:hover{border-color:var(--status-red)}
.primary:disabled,.secondary:disabled{opacity:.5;cursor:not-allowed}
.text-btn{display:inline-flex;align-items:center;gap:6px;padding:6px 2px;color:var(--brand-text);font-size:13px;font-weight:700}
.text-btn svg{width:15px;height:15px}
.text-btn:hover{text-decoration:underline}
.row-edit,.row-remove{width:32px;height:32px;display:grid;place-items:center;flex:0 0 auto;border-radius:var(--radius-xs);background:transparent;color:var(--text-muted);transition:background .12s,color .12s}
.row-edit svg,.row-remove svg{width:16px;height:16px}
.row-edit:hover{background:var(--brand-tint);color:var(--brand-text)}
.row-remove:hover{background:var(--status-red-bg);color:var(--status-red-fg)}

/* ---- Inputs ---- */
.field{display:block;margin:12px 0;color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.field small{display:inline;margin-left:4px;color:var(--text-muted);font-size:11.5px;font-weight:500;letter-spacing:0;text-transform:none}
.field>small:last-child{display:block;margin:5px 0 0}
.field input,.field select,.field textarea,.tool-fields input,.tool-income input,.jack-composer input{display:block;width:100%;min-height:40px;margin-top:6px;padding:9px 12px;border:1px solid var(--input-border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--text-1);font-size:14px;font-weight:500;letter-spacing:0;text-transform:none;outline:none;transition:border-color .14s var(--ease),box-shadow .14s var(--ease)}
.field textarea{resize:vertical;min-height:84px}
.field input:focus,.field select:focus,.field textarea:focus,.tool-fields input:focus,.tool-income input:focus,.jack-composer input:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px var(--accent-glow);outline:none}
.field input:disabled{background:var(--bg-panel-2);color:var(--text-muted);cursor:not-allowed}
.field input[type=date]{min-height:40px}
.check-line{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--text-2);font-size:13.5px}
.check-line input{width:18px;height:18px;margin:0;accent-color:var(--brand)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.three{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.two>.field,.three>.field{margin:12px 0}
.error{display:block;min-height:18px;margin-top:8px;color:var(--status-red-fg);font-size:12.5px;font-weight:600}

/* ---- Lock screen ---- */
.lock-page{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg-app)}
.lock-card{width:min(400px,100%);padding:30px 32px 28px;border:1px solid var(--border-soft);border-radius:var(--radius-lg);background:var(--bg-card);box-shadow:var(--shadow-3);text-align:center}
.lock-brand{margin:0 auto 10px}
.lock-kicker{margin:0 0 6px;color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.lock-card h1{font-size:24px}
.lock-card #lockCopy{max-width:300px;margin:8px auto 20px;color:var(--text-2);font-size:13.5px}
.pin-input{display:block;width:100%;height:60px;padding:0 16px;border:1px solid var(--input-border);border-radius:var(--radius-sm);background:var(--input-bg);color:var(--text-1);text-align:center;font-family:var(--font);font-size:28px;font-weight:800;letter-spacing:14px;text-indent:14px;caret-color:transparent;outline:none;transition:border-color .14s,box-shadow .14s}
.pin-input:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px var(--accent-glow)}
.unlock{width:100%;margin-top:12px}
.security{display:flex;align-items:flex-start;justify-content:center;gap:7px;margin-top:14px;color:var(--text-muted);font-size:12px;line-height:1.45;text-align:left}
.security svg{width:15px;height:15px;margin-top:1px}

/* ---- Brand lockups (supplied wordmark only, never redrawn) ---- */
.wordmark{display:block;height:auto;margin:0 auto}
.lock-brand .wordmark,.wizard-brand .wordmark{width:184px;max-width:70%}
.wm-on-light{display:block}.wm-on-dark{display:none}
body.dark .wm-on-light{display:none}body.dark .wm-on-dark{display:block}
.brand-name{display:block;font-size:22px;font-weight:800;letter-spacing:-.01em}
.brand-name[hidden]{display:none}
.lucerna-footer{margin-top:28px;padding-top:20px;border-top:1px solid var(--border-soft);text-align:center}
.lucerna-footer img{width:116px;height:auto;margin:0 auto;opacity:.8}
.lucerna-footer .lu-dark{display:none}
body.dark .lucerna-footer .lu-light{display:none}body.dark .lucerna-footer .lu-dark{display:block}

/* ---- Shell ---- */
.shell{min-height:100vh;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr)}
.sidebar{position:sticky;top:0;z-index:30;width:var(--sidebar-w);height:100vh;display:flex;flex-direction:column;padding:16px 12px 12px;background:var(--bg-sidebar);color:var(--text-on-dark)}
.brand{display:block;margin:0 0 14px;padding:0;text-align:center}
.brand .wordmark{width:208px;max-width:100%}
.brand .brand-name{padding:18px 0;color:var(--text-on-dark)}
.nav{flex:1;display:flex;flex-direction:column;gap:2px;overflow-y:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-title{margin:14px 0 6px;padding:0 14px;color:var(--text-on-dark-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.8}
.nav-title:first-child{margin-top:4px}
.nav button{position:relative;width:100%;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:var(--radius-sm);color:var(--text-on-dark-muted);text-align:left;font-size:14px;font-weight:600;transition:background .12s,color .12s}
.nav button svg{width:18px;height:18px}
.nav button:hover{background:rgba(255,255,255,.05);color:var(--text-on-dark)}
.nav button.active{background:rgba(255,255,255,.08);color:var(--text-on-dark)}
.nav button.active svg{color:var(--brand)}
.nav button.active::before{content:"";position:absolute;left:-12px;top:50%;width:3px;height:24px;transform:translateY(-50%);border-radius:0 3px 3px 0;background:var(--brand)}
.vault-note{display:flex;align-items:center;gap:10px;margin-top:10px;padding:12px 12px 2px;border-top:1px solid rgba(255,255,255,.08);color:var(--text-on-dark-muted)}
.vault-note svg{width:18px;height:18px}
.vault-note b,.vault-note small{display:block}
.vault-note b{color:var(--text-on-dark);font-size:12.5px;font-weight:700}
.vault-note small{font-size:11.5px}
.workspace{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;height:var(--topbar-h);display:flex;align-items:center;gap:14px;padding:0 var(--gutter);border-bottom:1px solid var(--border-soft);background:var(--topbar-bg);-webkit-backdrop-filter:saturate(160%) blur(16px);backdrop-filter:saturate(160%) blur(16px)}
.topbar h1{flex:1;min-width:0;overflow:hidden;font-size:24px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;text-overflow:ellipsis}
.top-actions{display:flex;align-items:center;gap:10px}
.ask-jack{height:38px;display:inline-flex;align-items:center;gap:8px;padding:0 15px;border:1px solid transparent;border-radius:999px;background:var(--brand-tint);color:var(--brand-text);font-size:13.5px;font-weight:700;transition:border-color .12s,background .12s}
.ask-jack svg{width:16px;height:16px}
.ask-jack:hover{border-color:var(--brand)}
.icon-btn,.nav-toggle{width:38px;height:38px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--border-soft);border-radius:50%;background:var(--bg-panel-2);color:var(--text-2);transition:border-color .12s,color .12s}
.icon-btn svg,.nav-toggle svg{width:17px;height:17px}
.icon-btn:hover,.nav-toggle:hover{border-color:var(--brand);color:var(--text-1)}
.avatar{width:38px;height:38px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:var(--brand);color:var(--on-brand);font-size:13px;font-weight:800;transition:background .12s}
.avatar:hover{background:var(--brand-dark)}
.nav-toggle{display:none}
.nav-scrim{position:fixed;inset:0;z-index:290;background:var(--scrim);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.nav-scrim[hidden]{display:none}
.content{width:100%;max-width:var(--content-max);margin:0 auto;padding:24px var(--gutter) 64px}
.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.heading:empty{display:none}
.date{margin:0 0 4px;color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.heading h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin-bottom:2px}
.heading h2:empty{display:none}
.heading .sub{color:var(--text-2);font-size:13.5px}
#headingAction:empty{display:none}
.page-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin:0 0 16px}

/* ---- Panels, cards ---- */
.panel{padding:16px 18px 18px;border:1px solid var(--border-soft);border-radius:var(--radius-lg);background:var(--bg-panel);box-shadow:var(--shadow-1)}
.panel-head{display:flex;align-items:center;gap:12px;margin:0 -18px 6px;padding:0 18px 14px;border-bottom:1px solid var(--border-soft)}
.panel-head::before{content:"";flex:0 0 auto;width:3px;height:16px;border-radius:3px;background:var(--brand)}
.panel-head>div:first-child{min-width:0;margin-right:auto}
.panel-head h2{font-size:15.5px;font-weight:700;letter-spacing:0}
.panel-head p{margin-top:2px;color:var(--text-muted);font-size:12px}
.panel-head>b{font-size:13px;color:var(--text-2)}
.section-title{margin:18px 0 8px;font-size:15px;font-weight:700}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.budget-card,.loan-card,.contact-card,.tool-card{padding:16px 18px;border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--bg-card);box-shadow:var(--shadow-1)}
.chip-ic,.merchant,.cat-gem,.setting-icon,.loan-person,.contact-top>span,.tool-head>span,.file-icon,.life-pulse button>i{display:grid;place-items:center;flex:0 0 auto;border-radius:var(--radius-xs);background:var(--brand-tint);color:var(--brand-text);font-style:normal;font-weight:800}
.merchant,.file-icon{width:30px;height:30px;background:var(--bg-panel-2);color:var(--text-muted)}
.merchant svg,.file-icon svg{width:15px;height:15px}
.merchant.in{background:var(--status-green-bg);color:var(--status-green-fg)}
.cat-gem,.setting-icon,.loan-person,.contact-top>span,.tool-head>span,.life-pulse button>i{width:40px;height:40px;border-radius:var(--radius-sm);font-size:15px}
.cat-gem svg,.setting-icon svg,.tool-head>span svg,.life-pulse button>i svg{width:20px;height:20px}

/* ---- KPI tiles and summary tiles ---- */
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 16px}
.metric,.bill-summary>div,.owed-summary>div,.contact-summary>div{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0;padding:16px;border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--bg-card);box-shadow:var(--shadow-1);text-align:left}
button.metric{cursor:pointer;transition:border-color .12s var(--ease),box-shadow .12s var(--ease),transform .12s var(--ease)}
button.metric:hover{border-color:var(--brand);box-shadow:var(--shadow-2);transform:translateY(-2px)}
.metric .kpi-ic{position:absolute;top:14px;right:14px;color:var(--text-muted);opacity:.7}
.metric .kpi-ic svg{width:18px;height:18px}
.metric.kpi-warn .kpi-ic{color:var(--status-red-fg);opacity:1}
.metric small,.bill-summary small,.owed-summary small,.contact-summary small,.data-stats small,.summary-totals small{display:block;padding-right:24px;color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.metric strong,.bill-summary b,.owed-summary b,.contact-summary b{display:block;max-width:100%;color:var(--text-1);font-size:28px;font-weight:800;line-height:1.15;letter-spacing:-.02em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.metric em,.owed-summary span{display:block;color:var(--text-muted);font-size:12.5px;font-style:normal}
.bill-summary b span{display:inline;color:var(--text-muted);font-size:14px;font-weight:600;letter-spacing:0}
.bill-summary,.owed-summary,.contact-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}

/* ---- Overview ---- */
.life-pulse{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.life-pulse button{display:flex;align-items:center;gap:12px;min-width:0;padding:14px 16px;border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--bg-card);box-shadow:var(--shadow-1);text-align:left;transition:border-color .12s var(--ease),box-shadow .12s var(--ease)}
.life-pulse button:hover{border-color:var(--brand);box-shadow:var(--shadow-2)}
.life-pulse button>span{min-width:0;flex:1}
.life-pulse small,.life-pulse b,.life-pulse em{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.life-pulse small{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.life-pulse b{margin:2px 0 1px;font-size:14.5px;font-weight:700}
.life-pulse em{color:var(--text-muted);font-size:12.5px;font-style:normal}
.life-pulse button>strong{color:var(--text-muted)}
.life-pulse button>strong svg{width:16px;height:16px}
.life-pulse .attention>i{background:var(--status-red-bg);color:var(--status-red-fg)}
.life-pulse .attention em{color:var(--status-red-fg);font-weight:700}
.balance{display:grid;grid-template-columns:minmax(220px,.62fr) minmax(0,1.38fr);gap:24px;padding:18px 20px;border:1px solid var(--border-soft);border-radius:var(--radius-lg);background:var(--bg-panel);box-shadow:var(--shadow-1)}
.balance-copy{display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;padding-right:20px;border-right:1px solid var(--border-soft)}
.balance-copy>span{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.balance-copy strong{font-size:34px;font-weight:800;line-height:1.1;letter-spacing:-.025em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.balance-copy em{display:inline-flex;align-items:center;gap:5px;width:max-content;max-width:100%;padding:4px 10px;border-radius:999px;background:var(--status-green-bg);color:var(--status-green-fg);font-size:12px;font-style:normal;font-weight:700}
.balance-copy em svg{width:13px;height:13px}
.balance-copy em.down{background:var(--status-red-bg);color:var(--status-red-fg)}
.balance-copy>small{color:var(--text-muted);font-size:12px;line-height:1.5}
.cashflow{min-width:0}
.cashflow-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.cashflow-head b,.cashflow-head small{display:block}
.cashflow-head b{font-size:15.5px;font-weight:700}
.cashflow-head small{margin-top:2px;color:var(--text-muted);font-size:12px}
.cashflow-key{display:flex;flex-wrap:wrap;gap:14px;color:var(--text-2);font-size:12.5px;font-weight:600}
.cashflow-key span{display:flex;align-items:center;gap:6px}
.cashflow-key i{width:10px;height:10px;border-radius:3px;background:var(--brand)}
.cashflow-key span:last-child i{background:var(--text-muted)}
.cash-chart{height:170px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:end;gap:10px;margin-top:12px;padding-top:12px;border-bottom:1px solid var(--border)}
.cash-col{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:7px;min-width:0}
.cash-bars{height:126px;width:100%;display:flex;align-items:flex-end;justify-content:center;gap:4px;background:repeating-linear-gradient(to top,var(--border-soft) 0 1px,transparent 1px 42px)}
.cash-bars i{display:block;width:30%;max-width:18px;min-height:0;border-radius:4px 4px 0 0;background:var(--brand);transition:height .35s var(--ease)}
.cash-bars .cash-expense{background:var(--text-muted)}
.cash-col>b{color:var(--text-muted);font-size:12px;font-weight:600}
.transaction{display:grid;grid-template-columns:30px minmax(0,1fr) auto 32px 32px;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border-soft)}
.transaction.read-only{grid-template-columns:30px minmax(0,1fr) auto}
.panel-head+.transaction,.transaction:first-child{border-top:0}
.transaction b,.transaction small{display:block;overflow:hidden;text-overflow:ellipsis}
.transaction b{font-size:14px;font-weight:600;white-space:nowrap}
.transaction small{margin-top:2px;color:var(--text-muted);font-size:12px;white-space:nowrap}
.transaction>strong{font-size:14px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.budget-ring{--percent:0%;position:relative;width:156px;height:156px;display:grid;place-items:center;margin:18px auto 14px;border-radius:50%;background:conic-gradient(var(--brand) var(--percent),var(--border-soft) 0)}
.budget-ring.over{background:conic-gradient(var(--status-red) var(--percent),var(--border-soft) 0)}
.budget-ring::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--bg-panel)}
.budget-ring>div{position:relative;z-index:1;max-width:112px;text-align:center}
.budget-ring strong,.budget-ring small{display:block}
.budget-ring strong{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.budget-ring small{color:var(--text-muted);font-size:12px}
.legend{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--text-2);font-size:12.5px;font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--brand)}
.legend i.pale{margin-left:10px;background:var(--border)}

/* ---- Budgets ---- */
.budget-card .top{display:flex;align-items:flex-start;justify-content:space-between}
.budget-card h3{margin:14px 0 2px;font-size:16px;font-weight:700;overflow-wrap:anywhere}
.budget-card p{color:var(--text-2);font-size:13.5px}
.budget-card small{color:var(--text-muted);font-size:12.5px}
.budget-card small.over{display:inline-flex;align-items:center;gap:5px;color:var(--status-red-fg);font-weight:700}
.budget-card small.over svg{width:14px;height:14px}
.progress,.loan-progress{height:8px;overflow:hidden;margin:12px 0 8px;border-radius:999px;background:var(--border-soft)}
.progress i,.loan-progress i{display:block;height:100%;border-radius:inherit;background:var(--brand)}
.progress.over i{background:var(--status-red)}

/* ---- Tables and row lists ---- */
.table-panel{padding:0;overflow:hidden}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--border-soft)}
.table-toolbar b,.table-toolbar span{display:block}
.table-toolbar b{font-size:15px;font-weight:700}
.table-toolbar span{color:var(--text-muted);font-size:12px}
.transaction-list{padding:2px 18px 6px}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.bill-table{min-width:620px}
.bill-head,.bill-row{display:grid;grid-template-columns:minmax(200px,1fr) 120px 90px 120px 32px;align-items:center;gap:12px}
.bill-head{padding:10px 18px;border-bottom:1px solid var(--border-soft);background:var(--bg-panel-2);color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.bill-row{padding:12px 18px;border-top:1px solid var(--border-soft);font-size:14px}
.bill-head+.bill-row{border-top:0}
.bill-row>div{display:flex;align-items:center;gap:12px;min-width:0}
.bill-row>div>div{min-width:0}
.bill-row b,.bill-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bill-row b{font-weight:600}
.bill-row small{color:var(--text-muted);font-size:12px}
.bill-row>strong{font-variant-numeric:tabular-nums}
.bill-row .due-inline{display:none}
.bill-row.is-paid{background:var(--bg-panel-2)}
.bill-paid{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:var(--bg-card);color:var(--text-1);font-size:12.5px;font-weight:700}
.bill-paid svg{width:14px;height:14px}
.bill-paid:hover{border-color:var(--brand)}
.bill-paid.paid,.bill-paid.paid:hover{border-color:transparent;background:var(--status-green-bg);color:var(--status-green-fg);cursor:default}
.doc-row{display:grid;grid-template-columns:30px minmax(0,1fr) auto 32px;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--border-soft)}
.doc-row:first-child{border-top:0}
.doc-row b,.doc-row small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-row b{font-size:14px;font-weight:600}
.doc-row small{color:var(--text-muted);font-size:12px}
.doc-row a{display:inline-flex;align-items:center;gap:5px;color:var(--brand-text);font-size:13px;font-weight:700;text-decoration:none}
.doc-row a svg{width:15px;height:15px}
.doc-row a:hover{text-decoration:underline}
.upload{display:grid;grid-template-columns:40px minmax(0,1fr) minmax(200px,.7fr) auto;align-items:center;gap:14px;margin-bottom:16px;padding:16px 18px;border:1px dashed var(--border);border-radius:var(--radius-lg);background:var(--bg-panel)}
.upload>span{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--brand-tint);color:var(--brand-text)}
.upload>span svg{width:20px;height:20px}
.upload h3{font-size:15.5px;font-weight:700}
.upload p{margin-top:2px;color:var(--text-muted);font-size:12.5px}
.upload input{min-width:0;color:var(--text-2);font-size:13px}
.upload input::file-selector-button{margin-right:10px;padding:7px 12px;border:1px solid var(--border);border-radius:var(--radius-xs);background:var(--bg-card);color:var(--text-1);font:inherit;font-weight:700;cursor:pointer}

/* ---- Pills, filters, segmented ---- */
.pill,.loan-status{display:inline-flex;align-items:center;gap:5px;flex:0 0 auto;padding:4px 10px;border-radius:999px;background:var(--bg-panel-2);color:var(--text-2);font-size:11.5px;font-weight:700;line-height:1.3;white-space:nowrap}
.pill svg,.loan-status svg{width:13px;height:13px}
.loan-card.overdue .loan-status,.pill.red{background:var(--status-red-bg);color:var(--status-red-fg)}
.loan-status.settled,.pill.green{background:var(--status-green-bg);color:var(--status-green-fg)}
.pill.amber{background:var(--status-amber-bg);color:var(--status-amber-fg)}
.filter-chips{display:flex;flex-wrap:wrap;gap:8px}
.filter-chips button{min-height:34px;padding:0 14px;border:1px solid var(--border);border-radius:999px;background:var(--bg-card);color:var(--text-2);font-size:12.5px;font-weight:700;transition:border-color .12s,background .12s,color .12s}
.filter-chips button:hover{border-color:var(--brand);color:var(--text-1)}
.filter-chips button.active{border-color:transparent;background:var(--brand);color:var(--on-brand)}
.segmented,.owed-view-tabs{display:inline-flex;flex-wrap:wrap;gap:0;overflow:hidden;border:1px solid var(--border);border-radius:999px;background:var(--bg-card)}
.segmented button,.owed-view-tabs button{min-height:34px;padding:0 14px;color:var(--text-2);font-size:13px;font-weight:700;transition:background .12s,color .12s}
.segmented button:hover,.owed-view-tabs button:hover{color:var(--text-1);background:var(--row-hover)}
.segmented button.active,.owed-view-tabs button.active{background:var(--brand);color:var(--on-brand)}
.owed-view-tabs{margin:0 0 16px}
.owed-view-tabs span{margin-left:4px;opacity:.75}

/* ---- Owed to you / You owe ---- */
.owed-toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:12px;padding:14px 16px;border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--bg-panel)}
.owed-toolbar b,.owed-toolbar small{display:block}
.owed-toolbar b{font-size:15px;font-weight:700}
.owed-toolbar small{margin-top:2px;color:var(--text-muted);font-size:12.5px}
.loan-grid,.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.loan-grid>.empty,.contact-grid>.empty{grid-column:1/-1}
.loan-card.overdue{border-color:var(--status-red)}
.loan-top,.contact-top{display:flex;align-items:center;gap:12px}
.loan-top>div,.contact-top>div{min-width:0;flex:1}
.loan-top h3,.contact-top h3{font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loan-top p,.contact-top p{margin-top:2px;overflow:hidden;color:var(--text-muted);font-size:12.5px;text-overflow:ellipsis;white-space:nowrap}
.loan-amount{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin-top:16px}
.loan-amount small{margin-right:auto;color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.loan-amount strong{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.loan-amount span{color:var(--text-muted);font-size:12.5px}
.loan-dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 0;border-top:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft)}
.loan-dates:has(.projected-date){grid-template-columns:repeat(4,minmax(0,1fr))}
.loan-dates small,.loan-dates b{display:block}
.loan-dates small{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.loan-dates b{margin-top:3px;font-size:13px;font-weight:700}
.projected-date em{display:block;margin-top:2px;color:var(--text-muted);font-size:11.5px;font-style:normal;line-height:1.35}
.loan-actions,.contact-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.loan-actions .primary,.loan-actions .secondary,.contact-actions .primary,.contact-actions .secondary{min-height:36px;padding:0 13px;font-size:13px}
.loan-actions .row-remove,.contact-actions .row-remove{margin-left:auto}
.loan-complete{display:inline-flex;align-items:center;gap:6px;color:var(--status-green-fg);font-size:13px;font-weight:700}
.loan-complete svg{width:15px;height:15px}
.contact-money{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin:14px 0;padding:12px 14px;border-radius:var(--radius-sm);background:var(--bg-panel-2)}
.contact-money small{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.contact-money span{color:var(--text-muted);font-size:12.5px}
.contact-money strong{grid-row:1/3;grid-column:2;align-self:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.contact-behaviour{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.contact-behaviour>div{padding:12px;border:1px solid var(--border-soft);border-radius:var(--radius-sm)}
.contact-behaviour small,.contact-behaviour b,.contact-behaviour span{display:block}
.contact-behaviour small{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.contact-behaviour b{margin:3px 0;font-size:13.5px;font-weight:700}
.contact-behaviour span{color:var(--text-muted);font-size:12px;line-height:1.4}
.contact-notes{margin:12px 0 0;padding:10px 12px;border-left:3px solid var(--border);border-radius:0 var(--radius-xs) var(--radius-xs) 0;background:var(--bg-panel-2);color:var(--text-2);font-size:13px}
.contact-actions a.secondary{text-decoration:none}

/* ---- Reports ---- */
.reports{display:grid;grid-template-columns:minmax(260px,.6fr) minmax(0,1.4fr);gap:16px;align-items:start}
.export-card .stack{margin-top:14px}
.export-card>p{color:var(--text-2);font-size:13.5px}
.export-card h2{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:700}
.export-card h2 span{width:40px;height:40px;display:grid;place-items:center;border-radius:var(--radius-sm);background:var(--brand-tint);color:var(--brand-text)}
.export-card h2 span svg{width:20px;height:20px}
.export-card>p{margin:10px 0 0}
.stack{display:flex;flex-direction:column;gap:8px}
.import-hint{display:block;margin-top:12px;color:var(--text-muted);font-size:12px;line-height:1.5}
.summary-totals,.data-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:12px 0 18px}
.summary-totals>div,.data-stats>div{min-width:0;padding:14px;border-radius:var(--radius-sm);background:var(--bg-panel-2)}
.summary-totals strong,.data-stats b{display:block;margin-top:4px;font-size:20px;font-weight:800;letter-spacing:-.015em;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.data-stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:4px 0 16px}
.bar{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) auto;align-items:center;gap:12px;padding:8px 0;font-size:13.5px}
.bar>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);font-weight:600}
.bar i{height:8px;overflow:hidden;border-radius:999px;background:var(--border-soft)}
.bar i b{display:block;height:100%;border-radius:inherit;background:var(--brand)}
.bar strong{text-align:right;font-variant-numeric:tabular-nums}

/* ---- Calculator ---- */
.calculator-layout{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:16px;align-items:start}
.calculator{overflow:hidden;border:1px solid var(--border-soft);border-radius:var(--radius-lg);background:var(--bg-panel);box-shadow:var(--shadow-1)}
.calc-screen{min-height:120px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:4px;padding:20px 22px;border-bottom:1px solid var(--border-soft);background:var(--bg-panel-2)}
.calc-screen small{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.calc-screen output{max-width:100%;overflow:hidden;font-size:34px;font-weight:800;letter-spacing:-.02em;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px}
.keys button{height:54px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-1);font-size:18px;font-weight:700;transition:border-color .12s,background .12s}
.keys button:hover{border-color:var(--brand);background:var(--row-hover)}
.keys button.op{color:var(--brand-text)}
.keys button.eq{border-color:transparent;background:var(--brand);color:var(--on-brand)}
.keys button.eq:hover{background:var(--brand-dark)}
.side-stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.tip{display:flex;gap:12px;padding:16px 18px;border:1px solid var(--border-soft);border-radius:var(--radius-md);background:var(--bg-panel)}
.tip>span{width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto;border-radius:var(--radius-sm);background:var(--brand-tint);color:var(--brand-text)}
.tip>span svg{width:20px;height:20px}
.tip h3{font-size:15px;font-weight:700}
.tip p{margin-top:3px;color:var(--text-2);font-size:13px}

/* ---- Planning tools (calculator page and legacy personal tools) ---- */
.money-tools-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.tool-head{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--border-soft)}
.tool-head h2{font-size:15.5px;font-weight:700}
.tool-head p{margin-top:2px;color:var(--text-muted);font-size:12.5px}
.tool-fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0}
.tool-fields label,.tool-income{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tool-income{display:block;margin:14px 0}
.tool-result{min-height:84px;padding:14px;border-radius:var(--radius-sm);background:var(--bg-panel-2)}
.tool-result small,.tool-result strong,.tool-result span{display:block}
.tool-result small{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.tool-result strong{margin:3px 0;font-size:22px;font-weight:800;letter-spacing:-.015em}
.tool-result span{color:var(--text-2);font-size:13px}
.rule-results{display:grid;gap:8px}
.rule-results>div{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg-panel-2)}
.rule-results i{width:6px;height:28px;border-radius:4px;background:var(--brand)}
.rule-results>div:nth-child(2) i{background:var(--text-muted)}
.rule-results>div:nth-child(3) i{background:var(--border)}
.rule-results span{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;flex:1}
.rule-results small{color:var(--text-2);font-size:13px}
.rule-results b{font-size:14px}
.tool-disclaimer{margin:12px 2px 0;color:var(--text-muted);font-size:12.5px;line-height:1.55}
.legacy-note{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--bg-panel);color:var(--text-2);font-size:13px;line-height:1.5}
.legacy-note svg{width:18px;height:18px;margin-top:1px;color:var(--text-muted)}
.legacy-note b{color:var(--text-1)}

/* ---- Legacy personal pay and tax ---- */
.payday-layout{display:grid;grid-template-columns:minmax(320px,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
.pay-form h2,.pay-results h2{font-size:16px;font-weight:700;margin:0 0 4px}
.pay-form>p{color:var(--text-2);font-size:13px;line-height:1.55;margin-bottom:6px}
.pay-form .three{grid-template-columns:1.25fr .75fr .75fr}
.tax-year-badge{display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
.pay-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:14px;padding:18px 20px;border-radius:var(--radius-md);background:var(--bg-panel-2)}
.pay-hero small{display:block;color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.pay-hero strong{display:block;margin-top:4px;font-size:28px;font-weight:800;letter-spacing:-.02em}
.pay-hero .pay-date{text-align:right}
.pay-hero .pay-date strong{font-size:16px;letter-spacing:0}
.gross-label{color:var(--text-muted);font-size:12.5px}
.deductions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.deduction{padding:12px;border:1px solid var(--border-soft);border-radius:var(--radius-sm)}
.deduction small{display:block;color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.deduction strong{display:block;margin-top:4px;font-size:16px;font-weight:800}
.deduction em{color:var(--text-muted);font-size:12px;font-style:normal}
.takehome-bar{height:8px;margin:14px 0 6px;border-radius:999px;background:linear-gradient(90deg,var(--brand) 0 var(--net,70%),var(--border) var(--net,70%) 100%)}
.annual-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border-soft);font-size:13.5px}
.annual-row.total{font-size:14.5px;font-weight:800}
.payday-list{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 16px}
.payday-chip{padding:6px 12px;border:1px solid var(--border);border-radius:999px;font-size:12.5px;font-weight:600}
.salary-action{display:flex;justify-content:flex-end;margin-top:14px}
.callout{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px 14px;border:1px solid var(--status-amber);border-radius:var(--radius-sm);background:var(--status-amber-bg);color:var(--status-amber-fg);font-size:13px;line-height:1.5}
.callout svg{width:17px;height:17px;margin-top:1px}
.pay-source{margin-top:12px;color:var(--text-muted);font-size:12.5px;line-height:1.6}
.pay-settings-saved{margin-left:8px;color:var(--status-green-fg);font-size:12.5px}

/* ---- Settings ---- */
.settings-hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.settings-hub .wide{grid-column:1/-1}
.setting-head{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.setting-head h2{font-size:15.5px;font-weight:700}
.setting-head p{margin-top:2px;color:var(--text-muted);font-size:12.5px}
.pref-group{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--border-soft)}
.setting-head+.pref-group{border-top:0}
.pref-copy b,.pref-copy small{display:block}
.pref-copy b{font-size:14px;font-weight:600}
.pref-copy small{margin-top:2px;color:var(--text-muted);font-size:12.5px}
.switch{position:relative;width:44px;height:26px;flex:0 0 auto;border-radius:999px;background:var(--border);transition:background .15s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .15s var(--ease)}
.switch.on{background:var(--brand)}
.switch.on::after{left:21px}
.preference{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--border-soft);color:var(--text-2);font-size:13.5px}
.setting-head+.preference{border-top:0}
.preference b{color:var(--text-1)}
.data-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.settings-danger{margin-left:auto}
.profile-settings .profile-row{display:grid;grid-template-columns:minmax(200px,1fr) auto auto auto;align-items:end;gap:12px}
.profile-row .field{margin:0}
.profile-meta{min-width:130px;padding:6px 12px;border-left:1px solid var(--border-soft)}
.profile-meta small,.profile-meta b{display:block}
.profile-meta small{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.profile-meta b{margin-top:3px;font-size:13.5px}
.legacy-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}

/* ---- Empty states ---- */
.empty{padding:32px 16px;color:var(--text-muted);text-align:center}
.empty span{display:grid;place-items:center;margin-bottom:8px;color:var(--text-muted)}
.empty span svg{width:22px;height:22px}
.empty p{font-size:13.5px}

/* ---- Modals and confirmations ---- */
.modal-bg,.confirm-bg{position:fixed;inset:0;z-index:450;display:grid;place-items:center;padding:20px;background:var(--scrim);-webkit-backdrop-filter:saturate(150%) blur(10px);backdrop-filter:saturate(150%) blur(10px)}
.modal,.confirm{width:min(520px,100%);max-height:88vh;overflow:auto;padding:0 20px 0;border:1px solid var(--border-soft);border-radius:var(--radius-lg);background:var(--bg-card);color:var(--text-1);box-shadow:var(--shadow-3)}
.modal-head{position:sticky;top:0;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 -20px 4px;padding:14px 20px;border-bottom:1px solid var(--border-soft);background:var(--bg-card)}
.modal-head p{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.modal-head h2{margin-top:2px;font-size:17px;font-weight:800;overflow-wrap:anywhere}
.modal-head button{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border-radius:var(--radius-xs);color:var(--text-muted)}
.modal-head button svg{width:18px;height:18px}
.modal-head button:hover{background:var(--row-hover);color:var(--text-1)}
.modal-actions{position:sticky;bottom:0;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin:16px -20px 0;padding:14px 20px;border-top:1px solid var(--border-soft);background:var(--bg-card)}
.modal-note{margin:12px 0 0;padding:10px 12px;border-radius:var(--radius-sm);background:var(--bg-panel-2);color:var(--text-2);font-size:13px;line-height:1.5}
.confirm{width:min(420px,100%);padding:20px 20px 0}
.confirm h2{font-size:17px;font-weight:800;overflow-wrap:anywhere}
.confirm p{margin-top:8px;color:var(--text-2);font-size:13.5px;line-height:1.55}
.confirm .stack,.confirm .modal-actions{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin:18px -20px 0;padding:14px 20px;border-top:1px solid var(--border-soft)}
.repay-balance{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0 4px;padding:12px 14px;border-radius:var(--radius-sm);background:var(--bg-panel-2)}
.repay-balance small{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.repay-balance b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.history-original{display:grid;grid-template-columns:1fr auto;gap:4px;margin-top:12px;padding:14px;border-radius:var(--radius-sm);background:var(--bg-panel-2)}
.history-original small{grid-column:1/-1;color:var(--text-muted)}
.loan-history h3{margin:18px 0 6px;font-size:15px;font-weight:700}
.repayment-row{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--border-soft)}
.repayment-row b,.repayment-row small{display:block}
.repayment-row b{font-size:13.5px}
.repayment-row small{color:var(--text-muted);font-size:12px}
.history-total{display:flex;justify-content:space-between;margin-top:10px;padding:12px 0 0;border-top:1px solid var(--border)}
.history-total b{font-size:16px;font-weight:800}

/* ---- Toast ---- */
.toast{position:fixed;z-index:480;right:20px;bottom:82px;max-width:min(380px,calc(100vw - 40px));padding:12px 16px;border-left:3px solid var(--brand);border-radius:var(--radius-sm);background:var(--bg-sidebar);color:var(--text-on-dark);box-shadow:var(--shadow-3);font-size:13.5px;font-weight:600;line-height:1.45}
.toast.error{border-left-color:var(--status-red)}
/* While Mavis is open the toast moves to the top so it never covers the composer. */
body:has(.jack-panel.open) .toast{top:calc(var(--topbar-h) + 12px);bottom:auto}

/* ---- Storage warning ---- */
.storage-banner{position:fixed;z-index:600;left:50%;top:14px;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:12px 46px 12px 16px;border:1px solid var(--status-amber);border-radius:var(--radius-md);background:var(--status-amber-bg);color:var(--status-amber-fg);box-shadow:var(--shadow-3);font-size:13px;line-height:1.5}
.storage-banner b{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:inherit}
.storage-banner b svg{width:16px;height:16px}
.storage-banner button{position:absolute;top:8px;right:9px;width:30px;height:30px;display:grid;place-items:center;border-radius:var(--radius-xs);color:inherit}
.storage-banner button:hover{background:rgba(0,0,0,.08)}

/* ---- Mavis assistant ---- */
.jack-launcher{position:fixed;z-index:390;right:20px;bottom:20px;height:46px;display:flex;align-items:center;gap:8px;padding:0 16px 0 6px;border-radius:999px;background:var(--bg-sidebar);color:var(--text-on-dark);box-shadow:var(--shadow-2);font-size:13.5px;font-weight:700}
.jack-launcher b{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--brand);color:var(--on-brand)}
.jack-launcher b svg{width:17px;height:17px}
.jack-launcher:hover{box-shadow:var(--shadow-3)}
.jack-panel{position:fixed;z-index:400;right:20px;bottom:20px;width:400px;max-width:calc(100vw - 32px);display:none;flex-direction:column;overflow:hidden;border:1px solid var(--border-soft);border-radius:var(--radius-lg);background:var(--bg-card);box-shadow:var(--shadow-3)}
.jack-panel.open{display:flex}
.jack-header{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--bg-sidebar);color:var(--text-on-dark)}
.jack-header>span{width:34px;height:34px;display:grid;place-items:center;flex:0 0 auto;border-radius:50%;background:var(--brand);color:var(--on-brand)}
.jack-header>span svg{width:17px;height:17px}
.jack-header>div{min-width:0;flex:1}
.jack-header b,.jack-header small{display:block}
.jack-header b{color:var(--text-on-dark);font-size:15px}
.jack-header small{color:var(--text-on-dark-muted);font-size:12px}
.jack-header button{width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius-xs);color:var(--text-on-dark-muted)}
.jack-header button svg{width:17px;height:17px}
.jack-header button:hover{background:rgba(255,255,255,.08);color:var(--text-on-dark)}
.jack-body{min-height:240px;max-height:min(430px,55vh);overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:16px;scroll-behavior:smooth}
.jack-bubble{max-width:92%;padding:10px 14px;border-radius:16px 16px 16px 4px;background:var(--bg-panel-2);color:var(--text-1);font-size:13.5px;line-height:1.55}
.jack-bubble.me{align-self:flex-end;border-radius:16px 16px 4px 16px;background:var(--brand-tint)}
.jack-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.jack-action{min-height:32px;padding:0 12px;border:1px solid var(--border);border-radius:999px;background:var(--bg-card);color:var(--text-1);font-size:12.5px;font-weight:700}
.jack-action:hover{border-color:var(--brand)}
.jack-action:first-child{border-color:transparent;background:var(--brand);color:var(--on-brand)}
.jack-action:first-child:hover{background:var(--brand-dark)}
.jack-chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 12px}
.jack-chip{min-height:30px;padding:0 11px;border:1px solid var(--border);border-radius:999px;background:var(--bg-card);color:var(--text-2);font-size:12.5px;font-weight:700}
.jack-chip:hover{border-color:var(--brand);color:var(--text-1)}
.jack-suggest{display:none;max-height:190px;overflow-y:auto;border-top:1px solid var(--border-soft)}
.jack-suggest.open{display:block}
.jack-suggest button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border-soft);color:var(--text-1);text-align:left;font-size:13px}
.jack-suggest button:hover,.jack-suggest button.active{background:var(--brand-tint)}
.jack-suggest small{flex:0 0 auto;padding:2px 8px;border-radius:999px;background:var(--bg-panel-2);color:var(--text-muted);font-size:11px;font-weight:700;letter-spacing:.04em}
.jack-composer{display:flex;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--border-soft)}
.jack-composer input{flex:1;min-width:0;margin:0}

/* ---- Onboarding ---- */
.wizard-bg{position:fixed;inset:0;z-index:460;display:grid;place-items:center;padding:20px;background:var(--scrim);-webkit-backdrop-filter:saturate(150%) blur(12px);backdrop-filter:saturate(150%) blur(12px)}
.wizard-card{width:min(600px,100%);max-height:92vh;overflow:auto;padding:28px;border:1px solid var(--border-soft);border-radius:var(--radius-lg);background:var(--bg-card);box-shadow:var(--shadow-3)}
.wizard-intro,.wizard-done{text-align:center}
.wizard-brand{margin:0 auto 6px}
.wizard-mark{width:44px;height:44px;display:grid;place-items:center;margin:0 auto 14px;border-radius:var(--radius-sm);background:var(--brand-tint);color:var(--brand-text)}
.wizard-mark svg{width:22px;height:22px}
.wizard-kicker{margin:0 0 6px;color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.wizard-card h1{font-size:25px}
.wizard-card h2{font-size:22px}
.wizard-intro>p:not(.wizard-kicker),.wizard-copy>p:not(.wizard-kicker),.wizard-done>p:not(.wizard-kicker){max-width:460px;margin:8px auto 18px;color:var(--text-2);font-size:14px;line-height:1.6}
.wizard-copy{margin-bottom:8px}
.wizard-copy>p:not(.wizard-kicker){margin-left:0}
.wizard-features{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:20px 0}
.wizard-features span{display:flex;align-items:center;justify-content:center;gap:6px;padding:10px;border:1px solid var(--border-soft);border-radius:var(--radius-sm);color:var(--text-2);font-size:12.5px;font-weight:600}
.wizard-features svg{width:15px;height:15px;color:var(--brand-text)}
.wizard-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;margin-top:22px}
.wizard-intro .wizard-actions,.wizard-done .wizard-actions{justify-content:center}
.wizard-progress{display:flex;gap:6px;margin-bottom:24px}
.wizard-progress i{height:5px;flex:1;border-radius:999px;background:var(--border)}
.wizard-progress i.active{background:var(--brand)}
.wizard-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.wizard-summary div{padding:12px;border-radius:var(--radius-sm);background:var(--bg-panel-2);text-align:left}
.wizard-summary small,.wizard-summary b{display:block}
.wizard-summary small{color:var(--text-muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.wizard-summary b{margin-top:4px;font-size:13.5px;overflow-wrap:anywhere}

/* ---- Density and text size preferences ---- */
body.compact .content{padding-top:16px}
body.compact .panel{padding:12px 14px 14px}
body.compact .panel-head{margin:0 -14px 4px;padding:0 14px 10px}
body.compact .metric,body.compact .bill-summary>div,body.compact .owed-summary>div,body.compact .contact-summary>div,body.compact .budget-card,body.compact .loan-card,body.compact .contact-card,body.compact .tool-card{padding:12px 14px}
body.compact .transaction,body.compact .doc-row,body.compact .bill-row{padding-top:9px;padding-bottom:9px}
body.compact .life-pulse button{padding:10px 12px}
body.compact .pref-group,body.compact .preference{padding:9px 0}
body.text-large .content,body.text-large .jack-panel,body.text-large .modal-bg,body.text-large .confirm-bg,body.text-large .wizard-bg{zoom:1.12}

/* ---- Responsive ----
   Order matters: wide-to-narrow, each layout declared once above and only
   adjusted here, so no fixed grid can be redeclared after a narrow rule. */
@media(max-width:1180px){
  .metrics,.life-pulse{grid-template-columns:repeat(3,minmax(0,1fr))}
  .balance{grid-template-columns:1fr}
  .balance-copy{padding:0 0 16px;border-right:0;border-bottom:1px solid var(--border-soft)}
  .loan-dates:has(.projected-date){grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:1100px){
  .grid,.reports,.calculator-layout,.payday-layout{grid-template-columns:minmax(0,1fr)}
  .loan-grid,.contact-grid,.money-tools-grid{grid-template-columns:minmax(0,1fr)}
  .upload{grid-template-columns:40px minmax(0,1fr)}
  .upload input,.upload button{grid-column:1/-1}
}
@media(max-width:899px){
  :root{--gutter:20px}
  .shell{display:block}
  .nav-toggle{display:grid}
  .sidebar{position:fixed;inset:0 auto 0 0;z-index:300;width:min(272px,84vw);height:100%;transform:translateX(-100%);visibility:hidden;transition:transform .22s var(--ease),visibility 0s linear .22s}
  .sidebar.open{transform:none;visibility:visible;box-shadow:var(--shadow-3);transition:transform .22s var(--ease)}
  .sidebar .brand .wordmark{width:208px}
  .nav button.active::before{left:-12px}
  .settings-hub{grid-template-columns:minmax(0,1fr)}
  .settings-hub .wide{grid-column:auto}
  .profile-settings .profile-row{grid-template-columns:1fr 1fr}
  .profile-meta{padding-left:0;border-left:0}
  .data-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ask-jack{width:38px;padding:0;justify-content:center}
  .ask-jack .ask-label{display:none}
}
@media(max-width:760px){
  .metrics,.life-pulse,.bill-summary,.owed-summary,.contact-summary{grid-template-columns:minmax(0,1fr)}
  .summary-totals{grid-template-columns:minmax(0,1fr)}
  .heading{flex-direction:column;align-items:stretch}
  .heading #headingAction .primary{width:100%}
  .wizard-features,.wizard-summary{grid-template-columns:minmax(0,1fr)}
}
@media(max-width:580px){
  :root{--gutter:16px}
  .topbar{gap:8px}
  .topbar h1{font-size:20px}
  .top-actions{gap:6px}
  .content{padding-top:18px}
  .two,.three,.pay-form .three,.tool-fields,.deductions,.contact-behaviour{grid-template-columns:minmax(0,1fr)}
  .two>.field,.three>.field{margin:6px 0}
  .bill-table{min-width:0}
  .bill-head{display:none}
  .bill-row{grid-template-columns:minmax(0,1fr) auto 32px;padding:12px 16px}
  .bill-row>span{display:none}
  .bill-row .due-inline{display:inline}
  .bill-row>strong{grid-column:2;grid-row:1}
  .bill-row .bill-paid{grid-column:1/3;justify-self:start}
  .bill-row .row-remove{grid-column:3;grid-row:1}
  .transaction{grid-template-columns:30px minmax(0,1fr) auto;row-gap:2px}
  .transaction>.row-edit,.transaction>.row-remove{grid-row:2}
  .transaction>.row-edit{grid-column:2;justify-self:end}
  .transaction>.row-remove{grid-column:3;justify-self:end}
  .transaction-list{padding:2px 14px 6px}
  .table-toolbar{padding:12px 14px}
  .doc-row{grid-template-columns:30px minmax(0,1fr) 32px}
  .doc-row a{grid-column:2}
  .doc-row .row-remove{grid-column:3;grid-row:1}
  .loan-dates,.loan-dates:has(.projected-date){grid-template-columns:repeat(2,minmax(0,1fr))}
  .loan-actions .row-remove,.contact-actions .row-remove{margin-left:0}
  .owed-view-tabs{display:flex;width:100%}
  .owed-view-tabs button{flex:1}
  .filter-chips{width:100%}
  .data-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .profile-settings .profile-row{grid-template-columns:minmax(0,1fr)}
  .pref-group{flex-direction:column;align-items:flex-start}
  .settings-danger{margin-left:0}
  .bar{grid-template-columns:minmax(70px,110px) minmax(0,1fr) auto;gap:8px}
  .balance{padding:16px}
  .balance-copy strong{font-size:30px}
  .cashflow-head{flex-direction:column;gap:8px}
  .cash-chart{gap:4px}
  .cash-bars{gap:2px}
  .pay-hero{flex-direction:column;align-items:flex-start}
  .pay-hero .pay-date{text-align:left}
  .lock-card{padding:24px 20px}
  .wizard-card{padding:22px 18px}
  .modal,.confirm{padding-left:16px;padding-right:16px}
  .modal-head,.modal-actions,.confirm .stack,.confirm .modal-actions{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
  .jack-panel{inset:auto 8px 8px;width:auto;max-width:none}
  .jack-body{max-height:50vh}
  .jack-launcher{right:12px;bottom:12px}
  .jack-launcher span{display:none}
  .jack-launcher{padding:0 6px}
  .toast{right:12px;left:12px;bottom:70px;max-width:none}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.001ms!important;transition-duration:.001ms!important}
}

function updateMoneyTools(){/* Each tool updates only if it is on the current page; the Calculator page shows just the repayment estimate. */const set=(id,text)=>{const el=$('#'+id);if(el)el.textContent=text};if($('#savingResult')){const target=toolValue('savingTarget'),current=toolValue('savingCurrent'),monthly=toolValue('savingMonthly'),remaining=Math.max(0,target-current);if(remaining===0){set('savingResult','Goal reached');set('savingDetail',`${money(Math.round(Math.max(0,current-target)*100))} beyond the target.`)}else if(monthly===0){set('savingResult','Add a monthly amount');set('savingDetail',`${money(Math.round(remaining*100))} still needed.`)}else{const months=Math.ceil(remaining/monthly);set('savingResult',toolDate(months));set('savingDetail',`${months} month${months===1?'':'s'} to save ${money(Math.round(remaining*100))}.`)}}if($('#debtResult')){const balance=toolValue('debtBalance'),apr=toolValue('debtApr'),payment=toolValue('debtPayment'),rate=apr/1200;let debtMonths=0,debtInterest=0,left=balance;if(balance===0){set('debtResult','Already clear');set('debtDetail','There is no balance to repay.')}else if(payment===0||payment<=left*rate){set('debtResult','Payment too low');set('debtDetail',rate?`It must exceed the first month’s interest of ${money(Math.round(left*rate*100))}.`:'Add a monthly payment.')}else{while(left>.005&&debtMonths<1200){const interest=left*rate;debtInterest+=interest;left=Math.max(0,left+interest-payment);debtMonths++}if(debtMonths<1200){set('debtResult',toolDate(debtMonths));set('debtDetail',`${debtMonths} month${debtMonths===1?'':'s'}, about ${money(Math.round(debtInterest*100))} interest.`)}else{set('debtResult','Over 100 years');set('debtDetail','Try a larger monthly payment.')}}}if($('#splitResult')){const total=toolValue('splitTotal'),people=Math.max(1,Math.floor(toolValue('splitPeople'))),tip=toolValue('splitTip'),withTip=total*(1+tip/100);set('splitResult',money(Math.round(withTip/people*100)));set('splitDetail',`${money(Math.round(withTip*100))} total across ${people} ${people===1?'person':'people'}.`)}if($('#ruleNeeds')){const income=toolValue('ruleIncome');set('ruleNeeds',money(Math.round(income*50)));set('ruleWants',money(Math.round(income*30)));set('ruleSavings',money(Math.round(income*20)))}}

function openModal(type){const titles={transaction:'Add a transaction',budget:'Set a category budget',bill:'Add a recurring bill'},kicker={transaction:'Transactions',budget:'Budgets',bill:'Bills and reminders'};let fields=type==='transaction'?`<div class="two"><label class="field">Type<select name="kind"><option value="expense">Expenditure</option><option value="income">Income</option></select></label><label class="field">Date<input name="date" type="date" value="${esc(iso())}" required></label></div><label class="field">Description<input name="description" placeholder="e.g. Office supplies" required autofocus></label><div class="two"><label class="field">Category<select name="category">${catOptions()}</select></label><label class="field">Amount (£)<input name="amount" type="number" min="0.01" step="0.01" required></label></div><label class="field">Notes<textarea name="notes" rows="3"></textarea></label>`:type==='budget'?`<label class="field">Category<select name="category">${catOptions(incomeCats)}</select></label><label class="field">Monthly limit (£)<input name="limit" type="number" min="0" step="0.01" required autofocus></label>`:`<label class="field">Bill name<input name="name" placeholder="e.g. Business rates" required autofocus></label><div class="two"><label class="field">Amount (£)<input name="amount" type="number" min="0.01" step="0.01" required></label><label class="field">Due day<input name="dueDay" type="number" min="1" max="31" required></label></div><label class="field">Category<select name="category">${catOptions()}</select></label>`;$('#modalRoot').innerHTML=`<div class="modal-bg"><form id="entryForm" class="modal"><div class="modal-head"><div><p>${kicker[type]}</p><h2>${titles[type]}</h2></div><button type="button" id="closeModal" aria-label="Close">${icon('close')}</button></div>${fields}<div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary">Save</button></div></form></div>`;$('#c function openContactModal(contactId=''){const c=state.contacts.find(x=>x.id===contactId);$('#modalRoot').innerHTML=`<div class="modal-bg"><form id="contactForm" class="modal"><div class="modal-head"><div><p>Owed to you</p><h2>${c?'Edit contact':'Add a contact'}</h2></div><button type="button" id="closeModal" aria-label="Close">${icon('close')}</button></div><label class="field">Name<input name="name" value="${esc(c?.name||'')}" maxlength="60" required autofocus></label><div class="two"><label class="field">Phone<input name="phone" type="tel" value="${esc(c?.phone||'')}" placeholder="Optional"></label><label class="field">Email<input name="email" type="email" value="${esc(c?.email||'')}" placeholder="Optional"></label></div><label class="field">Notes<textarea name="notes" rows="3" placeholder="Anything useful to remember">${esc(c?.notes||'')}</textarea></label><div class="modal-note">Repayment timing is calculated from this contact’s linked lending records.</div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary">Save contact</button></div></form></div>`;$('#closeModal').onclick=$('#cancelModal').onclick=closeModal;$('#contactForm').onsubmit=e=>saveContact(e,contactId)}
function saveContact(e,contactId){e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),name=v.name.trim(),duplicate=state.contacts.find(c=>c.id!==contactId&&c.name.toLowerCase()===name.toLowerCase());if(duplicate)return flash('A contact with that name already exists','error');let c=state.contacts.find(x=>x.id===contactId);if(c){const oldName=c.name;Object.assign(c,{name,phone:String(v.phone||'').trim(),email:String(v.email||'').trim(),notes:String(v.notes||'').trim()});state.loans.filter(l=>l.contactId===c.id).forEach(l=>{l.person=name;const original=state.transactions.find(t=>String(t.notes||'').startsWith(`Lending record:${l.id}`));if(original)original.description=`Lent to ${name}`;(l.repayments||[]).forEach(r=>{const tx=state.transactions.find(t=>String(t.notes||'').startsWith(`Loan repayment:${l.id}:${r.id}`));if(tx)tx.description=`Repayment from ${name}`})})}else{c={id:id(),name,phone:String(v.phone||'').trim(),email:String(v.email||'').trim(),notes:String(v.notes||'').trim(),createdAt:new Date().toISOString()};state.contacts.push(c)}save();closeModal();render();flash(contactId?'Contact updated':'Contact added')}

function openLoanModal(){$('#modalRoot').innerHTML=`<div class="modal-bg"><form id="loanForm" class="modal"><div class="modal-head"><div><p>Owed to you</p><h2>Record money lent</h2></div><button type="button" id="closeModal" aria-label="Close">${icon('close')}</button></div><label class="field">Borrower name<input name="person" list="contactNames" placeholder="Name" maxlength="60" required autofocus><datalist id="contactNames">${(state.contacts||[]).map(c=>`<option value="${esc(c.name)}"></option>`).join('')}</datalist></label><div class="two"><label class="field">Amount lent (£)<input name="amount" type="number" min="0.01" step="0.01" required></label><label class="field">What was it for?<input name="reason" placeholder="e.g. Short-term advance"></label></div><div class="two"><label class="field">Date lent<input name="lentDate" type="date" value="${esc(iso())}" required></label><label class="field">Expected back by<input name="dueDate" type="date"></label></div><label class="check-line"><input name="recordOutgoing" type="checkbox" checked> Record this as expenditure now</label><div class="modal-note">The name is added to Contacts. Repayments can be added to income when you record them.</div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary">Save lending record</button></div></form></div>`;$('#closeModal').onclick=$('#cancelModal').onclick=closeModal;$('#loanForm').onsubmit=saveLoan}
function saveLoan(e){e.preventDefault();const form=e.target,v=Object.fromEntries(new FormData(form));if(v.dueDate&&v.dueDate<v.lentDate)return flash('The repayment date cannot be before the lending date','error');let contact=form.dataset.contactId&&state.contacts.find(c=>c.id===form.dataset.contactId);if(!contact)contact=state.contacts.find(c=>c.name.toLowerCase()===v.person.trim().toLowerCase());if(!contact){contact={id:id(),name:v.person.trim(),phone:'',email:'',notes:'',createdAt:new Date().toISOString()};state.contacts.push(contact)}const amount=Math.round(Number(v.amount)*100),loan={id:id(),contactId:contact.id,person:contact.name,reason:String(v.reason||'').trim(),amount,lentDate:v.lentDate,dueDate:v.dueDate||'',repayments:[],createdAt:new Date().toISOString()};state.loans.push(loan);if(form.elements.recordOutgoing.checked)state.transactions.push({id:id(),kind:'expense',date:loan.lentDate,description:`Lent to ${loan.person}`,category:'Other',amount,notes:`Lending record:${loan.id}${loan.reason?' · '+loan.reason:''}`});save();closeModal();render();flash(`Money lent to ${loan.person} recorded`)}
function openEditLoan(loanId){const l=state.loans.find(x=>x.id===loanId);if(!l)return;$('#modalRoot').innerHTML=`<div class="modal-bg"><form id="editLoanForm" class="modal"><div class="modal-head"><div><p>Owed to you</p><h2>Edit lending details</h2></div><button type="button" id="closeModal" aria-label="Close">${icon('close')}</button></div><label class="field">Borrower name<input name="person" value="${esc(l.person)}" maxlength="60" required autofocus></label><div class="two"><label class="field">Original amount<input value="${esc(money(l.amount))}" disabled><small>Locked to protect the repayment history</small></label><label class="field">What was it for?<input name="reason" value="${esc(l.reason||'')}" placeholder="Optional"></label></div><div class="two"><label class="field">Date lent<input name="lentDate" type="date" value="${esc(l.lentDate)}" required></label><label class="field">Expected back by<input name="dueDate" type="date" value="${esc(l.dueDate||'')}"></label></div><div class="modal-note">Changing the name or lending date also updates the linked expenditure transaction, if there is one.</div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary">Save changes</button></div></form></div>`;$('#closeModal').onclick=$('#cancelModal').onclick=closeModal;$('#editLoanForm').onsubmit=e=>saveEditedLoan(e,loanId)}
function saveEditedLoan(e,loanId){e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),l=state.loans.find(x=>x.id===loanId);if(!l)return;if(v.dueDate&&v.dueDate<v.lentDate)return flash('The repayment date cannot be before the lending date','error');const wanted=String(v.person||'').trim(),wasName=l.person;let contact=state.contacts.find(c=>c.id===l.contactId);if(contact&&contact.name.toLowerCase()!==wanted.toLowerCase()){const clash=state.contacts.find(c=>c.id!==contact.id&&c.name.toLowerCase()===wanted.toLowerCase());if(clash){contact=clash}else{contact.name=wanted;state.loans.forEach(x=>{if(x.contactId===contact.id)x.person=wanted});state.transactions.forEach(t=>{if(t.description===`Repayment from ${wasName}`)t.description=`Repayment from ${wanted}`;if(t.description===`Lent to ${wasName}`)t.description=`Lent to ${wanted}`})}}if(!contact)contact=state.contacts.find(c=>c.name.toLowerCase()===wanted.toLowerCase());if(!contact){contact={id:id(),name:wanted,phone:'',email:'',notes:'',createdAt:new Date().toISOString()};state.contacts.push(contact)}Object.assign(l,{contactId:contact.id,person:contact.name,reason:String(v.reason||'').trim(),lentDate:v.lentDate,dueDate:v.dueDate||''});const linked=state.transactions.find(t=>String(t.notes||'').startsWith(`Lending record:${l.id}`));if(linked){linked.date=l.lentDate;linked.description=`Lent to ${l.person}`;linked.notes=`Lending record:${l.id}${l.reason?' · '+l.reason:''}`}save();closeModal();render();flash('Lending details updated')}

 if(/^add.*(outgoing|expen)|record.*(spend|expen)/.test(q))return{html:'I can open a new expenditure form.',actions:[{label:'Add expenditure',action:'add:expense'}]};

 if(/budget/.test(q))return{html:`<b>${state.budgets.length}</b> category budget${state.budgets.length===1?' is':'s are'} set, totalling <b>${money(t.budget)}</b> a month.`,actions:[{label:'Open budgets',action:'go:Budgets'},{label:'Set a budget',action:'add:budget'}]};
 if(/setting|appearance|theme|pin|security/.test(q))return{html:'Settings covers your profile, appearance, PIN, automatic locking, Mavis and data.',actions:[{label:'Open Settings',action:'go:Settings'}]};
 if(/calculator|calculate|what is|\d\s*[+*\/−-]\s*\d/.test(q)){const expr=q.replace(/^.*?(?:calculate|what is)\s*/,'').replace(/[^0-9+*\/().−\-×÷]/g,'');try{return{html:`That comes to <b>${esc(calculate(expr))}</b>.`,actions:[{label:'Open calculator',action:'go:Calculator'}]}}catch{return{html:'I could not read that calculation. Try something like <b>1250 / 12</b>.'}}}
 const nav=sections.filter(([name])=>!legacySections.includes(name)).find(([name])=>q.includes(name.toLowerCase().split(' ')[0]));if(nav)return{html:`I can take you to <b>${esc(nav[0])}</b>.`,actions:[{label:'Open '+nav[0],action:'go:'+nav[0]}]};
 return{html:'I can help with the recorded <b>balance, cash flow, income, expenditure, budgets, bills, amounts owed, documents, exports and quick sums</b>. I can also open pages and forms.',actions:[{label:'Open Overview',action:'go:Overview'},{label:'Add transaction',action:'add:expense'}]}}
function jackAsk(value){const input=$('#jackInput'),q=String(value||input.value).trim();if(!q)return;input.value='';jackSuggestions('');jackAdd('me',q);const answer=jackAnswer(q);setTimeout(()=>jackAdd('jack',answer.html,answer.actions),140)}
function jackRunAction(action){if(action.startsWith('confirm:')){const key=action.slice(8),item=jackPending[key];if(!item)return jackAdd('jack','That pending item is no longer available.');state.transactions.push(item);jackUndo={type:'transaction',id:item.id};delete jackPending[key];save();render();jackAdd('jack',`Added <b>${esc(item.description)}</b> for <b>${money(item.amount)}</b>.`,[{label:'Undo',action:'undo'}]);return}if(action.startsWith('cancel:')){delete jackPending[action.slice(7)];jackAdd('jack','Cancelled. Nothing was added.');return}if(action==='undo'&&jackUndo){state.transactions=state.transactions.filter(x=>x.id!==jackUndo.id);jackUndo=null;save();render();jackAdd('jack','Undone. The last item I added has been removed.');return}if(action.startsWith('pref:')){const [,key,value]=action.split(':');setPref(key,value,section==='Settings');jackAdd('jack',`Done. ${key==='theme'?'The theme':key==='density'?'Layout density':'Text size'} is now <b>${esc(value)}</b>.`);return}if(action.startsWith('go:')){section=action.slice(3);renderNav();render();closeJack();return}if(action.startsWith('add:')){const type=action.slice(4);if(type==='loan')openLoanModal();else if(type==='debt')openDebtModal();else{openModal(['budget','bill'].includes(type)?type:'transaction');if(type==='income'||type==='expense')$('#entryForm').elements.kind.value=type}closeJack();return}if(action==='salary'){addSalaryIncome();jackAdd('jack','Added the estimated net salary and moved the next payday on.');return}if(action==='export'){exportXlsx();return}if(action==='backup'){backup();return}if(action==='lock'){closeJack();lock()}}
function jackSuggestions(value){const root=$('#jackSuggest'),q=value.trim().toLowerCase();jackSuggestIndex=-1;if(!q){root.classList.remove('open');root.innerHTML='';return}const matches=jackCommands.filter(x=>x.q.toLowerCase().includes(q)||x.tag.toLowerCase().includes(q)).slice(0,6);root.innerHTML=matches.map(x=>`<button data-jack-query="${esc(x.q)}"><span>${esc(x.q)}</span><small>${esc(x.tag)}</small></button>`).join('');root.classList.toggle('open',!!matches.length);root.querySelectorAll('button').forEach(b=>b.onclick=()=>jackAsk(b.dataset.jackQuery))}
function jackKey(e){const items=[...$('#jackSuggest').querySelectorAll('button')];if(e.key==='Enter'){e.preventDefault();jackAsk(items[jackSuggestIndex]?.dataset.jackQuery);return}if(!items.length)return;if(e.key==='ArrowDown')jackSuggestIndex=Math.min(items.length-1,jackSuggestIndex+1);else if(e.key==='ArrowUp')jackSuggestIndex=Math.max(0,jackSuggestIndex-1);else if(e.key==='Escape')return jackSuggestions('');else return;e.preventDefault();items.forEach((x,i)=>x.classList.toggle('active',i===jackSuggestIndex))}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='j'){e.preventDefault();if(unlocked)openJack()}});$('#lockBtn').onclick=lock;$('#themeBtn').onclick=()=>setPref('theme',document.body.classList.contains('dark')?'light':'dark');$('#profileAvatar').onclick=()=>{section='Settings';renderNav();render()};$('#askJack').onclick=openJack;$('#jackLauncher').onclick=openJack;$('#jackClose').onclick=closeJack;$('#jackClear').onclick=clearJack;$('#jackSend').onclick=()=>jackAsk();$('#jackInput').oninput=e=>jackSuggestions(e.target.value);$('#jackInput').onkeydown=jackKey;applyPrefs();start();
})();

<script>
/* Menu for narrow screens. Kept separate from the app so a failure here can
   never stop the rest of the page working. */
(function(){
  var btn=document.getElementById('navToggle'),
      scrim=document.getElementById('navScrim'),
      bar=document.getElementById('sidebar'),
      nav=document.getElementById('nav');
  if(!btn||!bar) return;
  var narrow=window.matchMedia('(max-width: 899px)');
  function set(open,returnFocus){
    var was=bar.classList.contains('open');
    bar.classList.toggle('open',open);
    if(scrim) scrim.hidden=!open;
    btn.setAttribute('aria-expanded',open?'true':'false');
    btn.setAttribute('aria-label',open?'Close menu':'Open menu');
    if(open){ var first=bar.querySelector('.nav button.active')||bar.querySelector('.nav button'); if(first) setTimeout(function(){ first.focus(); },30); }
    else if(was&&returnFocus) btn.focus();
  }
  btn.addEventListener('click',function(){ set(!bar.classList.contains('open'),true); });
  if(scrim) scrim.addEventListener('click',function(){ set(false,true); });
  if(nav) nav.addEventListener('click',function(e){ if(e.target.closest('button')&&narrow.matches) set(false,false); });
  document.addEventListener('keydown',function(e){
    if(!bar.classList.contains('open')) return;
    if(e.key==='Escape'){ set(false,true); return; }
    /* Keep Tab inside the open menu on narrow screens. */
    if(e.key==='Tab'&&narrow.matches){
      var items=[].slice.call(bar.querySelectorAll('button,a[href]')).filter(function(x){ return x.offsetParent!==null; });
      if(!items.length) return;
      var first=items[0], last=items[items.length-1];
      if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
    }
  });
  window.addEventListener('resize',function(){ if(!narrow.matches) set(false,false); });
})();
</script>
<script>
/* Dialog behaviour people expect: Escape closes, clicking the dark area
   closes, and the first field is ready to type in. Kept standalone so a
   failure here cannot stop the rest of the page working. The setup wizard
   is deliberately excluded, it has its own Skip. */
(function(){
  var root=document.getElementById('modalRoot');
  if(!root) return;
  var open=function(){return root.innerHTML.trim().length>0;};
  var opener=null;
  var shut=function(){ if(open()) root.innerHTML=''; };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') shut(); });
  root.addEventListener('mousedown',function(e){
    if(e.target===e.currentTarget) return shut();
    if(e.target.classList&&(e.target.classList.contains('modal-bg')||e.target.classList.contains('confirm-bg'))) shut();
  });
  // Tab stays inside the dialog while it is open.
  root.addEventListener('keydown',function(e){
    if(e.key!=='Tab') return;
    var items=[].slice.call(root.querySelectorAll('button:not([disabled]),input:not([disabled]):not([type=hidden]),select,textarea,a[href],label.secondary')).filter(function(x){ return x.offsetParent!==null; });
    if(!items.length) return;
    var first=items[0], last=items[items.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  });
  // Label each dialog, focus the first useful field, and return focus when it closes.
  try{
    new MutationObserver(function(){
      if(!open()){
        if(opener&&document.body.contains(opener)&&opener.offsetParent!==null){ try{ opener.focus(); }catch(err){} }
        opener=null; return;
      }
      if(!opener&&document.activeElement&&!root.contains(document.activeElement)) opener=document.activeElement;
      var box=root.querySelector('.modal,.confirm');
      if(box){
        box.setAttribute('role',box.classList.contains('confirm')?'alertdialog':'dialog');
        box.setAttribute('aria-modal','true');
        var title=box.querySelector('h2');
        if(title){ if(!title.id) title.id='dialogTitle'; box.setAttribute('aria-labelledby',title.id); }
      }
      var el=root.querySelector('input:not([type=hidden]):not([disabled]),select,textarea');
      if(!el) el=root.querySelector('.confirm .secondary,.modal-actions .primary,button');
      if(el&&!root.contains(document.activeElement)){ try{ el.focus({preventScroll:false}); }catch(err){} }
    }).observe(root,{childList:true});
  }catch(err){}
})();
</script>
