<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amethyst Money</title>
<meta name="description" content="Private, offline personal money management.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--violet:#6d318c;--violet-dark:#351548;--violet-mid:#5a2476;--lilac:#eee5f3;--soft:#f6f3f7;--panel:#fff;--ink:#241b29;--muted:#7d7282;--line:#ebe5ed;--green:#2f976b;--red:#c8545d;--shadow:0 12px 36px rgba(42,23,51,.08);box-sizing:border-box;color-scheme:light}
*,*:before,*:after{box-sizing:inherit}
html,body{margin:0;min-height:100%;background:#f4f1f5;color:var(--ink)}
body{font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
a{color:inherit}
.hidden{display:none!important}
.lock-page{min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 50% 12%,#faf7fc 0,#eee6f2 44%,#ded0e5 100%)}

.lock-kicker,.date{margin:0 0 7px;color:var(--violet);font-size:12.5px;font-weight:800;letter-spacing:.13em}
.lock-card h1{margin:0;font-size:25px;letter-spacing:-.025em}
.lock-card>p:not(.lock-kicker){max-width:320px;margin:9px auto 20px;color:var(--muted);font-size:12px;line-height:1.65}
.pin-input{display:block;width:100%;height:64px;padding:0 18px;border:2px solid #d9d3dc;border-radius:13px;background:#fbfafc;text-align:center;font-family:Arial,sans-serif;font-size:30px;font-weight:800;letter-spacing:14px;text-indent:14px;caret-color:transparent;color:#3b2b41;outline:none;box-shadow:inset 0 1px 2px rgba(35,28,39,.035);transition:border-color .18s,box-shadow .18s,background .18s}
.pin-input:focus{border-color:#684177;background:#fff;box-shadow:0 0 0 3px rgba(104,65,119,.13)}
.primary,.secondary,.danger{min-height:40px;padding:0 15px;border-radius:9px;font-size:11px;font-weight:750;transition:transform .15s,box-shadow .15s,background .15s}
.primary{background:linear-gradient(135deg,#6d318c,#51216b);color:#fff;box-shadow:0 7px 17px rgba(89,36,117,.18)}
.primary:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(89,36,117,.25)}
.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}
.danger{background:#fff0f1;color:#a53943;border:1px solid #f1cbd0}
.unlock{width:100%;margin-top:12px}
.error{display:block;min-height:18px;margin-top:7px;color:var(--red);font-size:12.5px}
.security{display:block;margin-top:16px;color:#625b68;font-size:11px;font-weight:500}
.shell{min-height:100vh;display:grid;grid-template-columns:238px minmax(0,1fr)}
.sidebar{position:fixed;inset:0 auto 0 0;z-index:3;width:238px;display:flex;flex-direction:column;padding:22px 16px 18px;background:linear-gradient(180deg,#321443 0%,#24102f 100%);color:#fff;box-shadow:8px 0 30px rgba(37,15,48,.13)}
.nav{display:flex;flex:1;flex-direction:column;gap:3px;overflow-y:auto}

.nav button.active i{color:#e6baf5}

.vault-note>span{color:#d6a8e9}.vault-note b,.vault-note small{display:block}.vault-note b{font-size:12px}.vault-note small{margin-top:2px;color:#aa95b2;font-size:11.5px}
.workspace{grid-column:2;min-width:0}
.topbar{position:sticky;top:0;z-index:2;height:70px;display:flex;align-items:center;justify-content:flex-end;padding:0 30px;background:rgba(255,255,255,.91);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.search{width:min(390px,48vw);height:38px;display:flex;align-items:center;gap:9px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#f7f4f8;color:var(--muted)}
.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;color:var(--ink);font-size:12.5px}

.page-actions{display:flex;justify-content:flex-end;margin:-55px 0 17px}

.balance-copy span{display:block;color:#cbb4d5;font-size:12px;text-transform:uppercase;letter-spacing:.11em}.balance-copy strong{display:block;margin:7px 0;font-size:40px;letter-spacing:-.04em}.balance-copy em{font-style:normal;color:#d6c5de;font-size:12.5px}
.chart{position:relative;height:145px;border-bottom:1px solid rgba(255,255,255,.12)}

.chart-dots{position:absolute;inset:0 2% 29px;display:flex;align-items:center;justify-content:space-between}.chart-dots i{width:7px;height:7px;border:2px solid #fff;border-radius:50%;background:#653082;box-shadow:0 0 0 3px rgba(255,255,255,.12)}.chart-dots i:nth-child(2){transform:translateY(-16px)}.chart-dots i:nth-child(3){transform:translateY(12px)}.chart-dots i:nth-child(4){transform:translateY(-24px)}.chart-dots i:nth-child(5){transform:translateY(-3px)}.chart-dots i:nth-child(6){transform:translateY(-35px)}
.chart-labels{position:absolute;inset:auto 0 0;display:flex;justify-content:space-between;color:#c8b2d2;font-size:11.5px}
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:16px 0}
.metric{display:flex;align-items:center;gap:13px;min-height:105px;padding:18px;background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}
.metric>span{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;font-size:17px}.metric.income>span{background:#e8f5ef;color:var(--green)}.metric.expense>span{background:#fff0f1;color:var(--red)}.metric.saving>span{background:#f0e8f5;color:var(--violet)}
.metric small,.metric strong,.metric em{display:block}.metric small{color:var(--muted);font-size:11.5px}.metric strong{margin:3px 0;font-size:18px}.metric em{font-style:normal;color:var(--muted);font-size:11.5px}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(285px,.55fr);gap:16px}
.panel,.budget-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.panel{padding:19px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:10px}.panel-head h2{margin:0;font-size:12px}.panel-head p{margin:3px 0 0;color:var(--muted);font-size:11.5px}.panel-head>b{font-size:12.5px}
.text-btn{padding:6px;background:none;color:var(--violet);font-size:12px;font-weight:700}
.transaction{display:grid;grid-template-columns:38px minmax(0,1fr) auto 25px;align-items:center;gap:11px;padding:11px 2px;border-top:1px solid var(--line)}.transaction:first-of-type{border-top:0}.merchant{width:36px;height:36px;display:grid;place-items:center;border-radius:10px;background:#eee5f3;color:var(--violet);font-size:11px;font-weight:800}.transaction b,.transaction small{display:block}.transaction b{font-size:12.5px}.transaction small{margin-top:3px;color:var(--muted);font-size:11.5px}.transaction>strong{font-size:12.5px}.positive{color:var(--green)!important}

.budget-ring{--percent:0%;position:relative;width:145px;height:145px;display:grid;place-items:center;margin:17px auto;border-radius:50%;background:conic-gradient(var(--violet) var(--percent),#ece6ef 0)}.budget-ring:after{content:"";position:absolute;inset:14px;border-radius:50%;background:#fff}.budget-ring>div{position:relative;z-index:1;text-align:center}.budget-ring strong,.budget-ring small{display:block}.budget-ring strong{font-size:14px}.budget-ring small{color:var(--muted);font-size:11.5px}.legend{display:flex;align-items:center;justify-content:center;gap:5px;color:var(--muted);font-size:11.5px}.legend i{width:7px;height:7px;border-radius:2px;background:var(--violet)}.legend i.pale{margin-left:8px;background:#e7dfe9}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.budget-card{padding:18px}.budget-card .top{display:flex;justify-content:space-between}.cat-gem{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#eee6f2;color:var(--violet)}.budget-card h3{margin:15px 0 2px;font-size:12px}.budget-card p,.budget-card small{color:var(--muted);font-size:12px}.progress{height:7px;overflow:hidden;margin:12px 0 7px;border-radius:7px;background:#ede7ef}.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#7e419d,#b06bc8)}
.table-panel{padding:0;overflow:hidden}.table-toolbar{padding:15px 18px;background:#faf8fb;border-bottom:1px solid var(--line)}.table-toolbar b,.table-toolbar span{display:block}.table-toolbar b{font-size:12.5px}.table-toolbar span{color:var(--muted);font-size:11.5px}.transaction-list{padding:5px 18px 12px}
.bill-head,.bill-row{display:grid;grid-template-columns:minmax(190px,1fr) 120px 90px 30px;align-items:center;gap:10px}.bill-head{padding:11px 18px;background:#faf8fb;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}.bill-row{padding:12px 18px;border-top:1px solid var(--line);font-size:12.5px}.bill-row>div{display:flex;align-items:center;gap:11px}.bill-row b,.bill-row small{display:block}.bill-row small{color:var(--muted);font-size:11.5px}
.upload{display:grid;grid-template-columns:44px 1fr minmax(210px,.65fr) auto;align-items:center;gap:14px;margin-bottom:16px;padding:17px 20px;border:1px dashed #cab8d2;border-radius:14px;background:#fff}.upload>span,.file-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;background:#eee6f2;color:var(--violet)}.upload h3,.upload p{margin:0}.upload h3{font-size:11px}.upload p{margin-top:3px;color:var(--muted);font-size:11.5px}.upload input{min-width:0;font-size:12px}
.doc-row{display:grid;grid-template-columns:42px minmax(0,1fr) auto 27px;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.doc-row:first-child{border-top:0}.doc-row b,.doc-row small{display:block}.doc-row b{font-size:12.5px}.doc-row small{color:var(--muted);font-size:11.5px}.doc-row a{color:var(--violet);font-size:12px;font-weight:700}
.reports{display:grid;grid-template-columns:minmax(260px,.58fr) 1.42fr;gap:16px}.export-card{text-align:center;padding:28px}.export-icon{width:50px;height:50px;display:grid;place-items:center;margin:0 auto 12px;border-radius:13px;background:#e5f2e9;color:#247c52;font-weight:900}.export-card h2{margin:0;font-size:14px}.export-card p{color:var(--muted);font-size:12px}.stack{display:flex;flex-direction:column;gap:8px}.summary-totals{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:13px 0 19px}.summary-totals div{padding:13px;border-radius:10px;background:#f7f4f8}.summary-totals small,.summary-totals strong{display:block}.summary-totals small{color:var(--muted);font-size:11.5px}.summary-totals strong{margin-top:4px;font-size:14px}.bar{display:grid;grid-template-columns:90px 1fr 75px;align-items:center;gap:10px;margin:10px 0;font-size:12px}.bar i{height:7px;overflow:hidden;border-radius:8px;background:#eee8f0}.bar i b{display:block;height:100%;border-radius:inherit;background:var(--violet)}.bar strong{text-align:right}
.calculator-layout{display:grid;grid-template-columns:minmax(310px,440px) minmax(250px,1fr);gap:16px}.calculator{overflow:hidden;border-radius:17px;background:#21102b;box-shadow:0 20px 45px rgba(39,16,50,.2)}.calc-screen{min-height:125px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;padding:24px;background:linear-gradient(145deg,#371646,#59236e);color:#fff}.calc-screen small{color:#bea8c7;font-size:11.5px}.calc-screen output{max-width:100%;overflow:hidden;font-size:36px}.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#33213b}.keys button{height:58px;background:#28172f;color:#eee5f1;font-size:14px}.keys button:hover{background:#3b2644}.keys button.op{color:#d4a3e5}.keys button.eq{background:var(--violet);color:#fff}.tip{height:max-content;display:flex;gap:13px;padding:18px;border:1px solid #ddcee4;border-radius:13px;background:#f6eff9}.tip>span{color:var(--violet)}.tip h3,.tip p{margin:0}.tip h3{font-size:11px}.tip p{margin-top:4px;color:var(--muted);font-size:12px}
.settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.settings .panel{padding:23px}.settings h2{margin:10px 0 3px;font-size:14px}.settings p{color:var(--muted);font-size:12px}.setting-icon{width:40px;height:40px;display:grid;place-items:center;border-radius:11px;background:#eee6f2;color:var(--violet)}.preference{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:12px}

.modal-bg,.confirm-bg{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:20px;background:rgba(24,12,29,.62);backdrop-filter:blur(5px)}.modal{width:min(530px,100%);max-height:90vh;overflow:auto;padding:23px;border-radius:16px;background:#fff;box-shadow:0 25px 75px rgba(27,12,33,.3)}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}.modal-head p{margin:0;color:var(--violet);font-size:11.5px;font-weight:800;letter-spacing:.12em}.modal-head h2{margin:3px 0 0;font-size:18px}.modal-head button{width:29px;height:29px;border-radius:8px;background:#f4f0f5;color:#7d7181}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.confirm{width:min(390px,100%);padding:25px;border-radius:16px;background:#fff;text-align:center}.confirm h2{margin:0;font-size:17px}.confirm p{color:var(--muted);font-size:12.5px;line-height:1.6}

:root{font-family:"Aptos","Aptos Display","Segoe UI Variable Display","Century Gothic","Segoe UI",sans-serif}.brand{height:64px;display:flex;align-items:center;justify-content:center;margin:0 0 24px}.brand img{display:block;width:176px;height:58px;object-fit:contain}.lock-logo{display:block;width:235px;height:82px;object-fit:contain;margin:0 auto 10px}.lock-card{padding-top:22px}.heading h1,.balance-copy strong,.metric strong,.summary-totals strong,.calc-screen output{font-family:"Aptos Display","Segoe UI Variable Display","Century Gothic",sans-serif}.heading h1{font-weight:700}.nav button{font-weight:600}
.payday-layout{display:grid;grid-template-columns:minmax(330px,.82fr) minmax(420px,1.18fr);gap:17px;align-items:start}.pay-form h2,.pay-results h2{font-size:17px;margin:0 0 4px}.pay-form>p,.pay-results>p{font-size:12.5px;line-height:1.55;margin-bottom:16px}.pay-form .three{display:grid;grid-template-columns:1.25fr .75fr .75fr;gap:10px}.check-line{display:flex;align-items:center;gap:9px;padding:10px 0;font-size:12.5px;color:var(--muted)}.check-line input{width:16px;height:16px;accent-color:var(--violet)}.tax-year-badge{display:inline-flex;align-items:center;gap:7px;background:#f0e8f7;color:#673491;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;margin-bottom:13px}.pay-hero{background:linear-gradient(125deg,#351548,#642a83);color:#fff;border-radius:16px;padding:22px 23px;margin-bottom:14px;display:flex;justify-content:space-between;gap:20px;align-items:center}.pay-hero small{display:block;color:#cdb7d8;font-size:12px;text-transform:uppercase;letter-spacing:.08em}.pay-hero strong{display:block;font-size:31px;margin-top:4px;letter-spacing:-.04em}.pay-hero .pay-date{text-align:right}.pay-hero .pay-date strong{font-size:17px;letter-spacing:0}.deductions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.deduction{background:#f7f4f8;border:1px solid #eee8f1;border-radius:11px;padding:12px}.deduction small{display:block;color:var(--muted);font-size:11.5px}.deduction strong{display:block;margin-top:4px;font-size:14px}.deduction em{font-style:normal;color:var(--muted);font-size:11.5px}.takehome-bar{margin:15px 0 5px;height:10px;border-radius:9px;background:linear-gradient(90deg,var(--green) 0 var(--net,70%),#d86068 var(--net,70%) 100%)}.annual-row{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:12.5px}.annual-row.total{font-size:12px;font-weight:800}.payday-list{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 16px}.payday-chip{background:#f6f2f8;border:1px solid #e9dfef;border-radius:9px;padding /* ============================================================
   Telecom Networks design system, amethyst edition.
   The same system used by Aurora and Alien HR, recoloured to
   amethyst. Defined last so these tokens win the cascade and
   flow through every view. Single source of truth for colour. */
:root{
  /* Brand, amethyst */
  --brand:#7d3cb5; --brand-dark:#4c2178; --brand-mid:#5f2d8f;
  --brand-accent:#b483e6; --brand-fg:#7d3cb5;
  --brand-tint:rgba(125,60,181,.10);
  --gradient-brand:linear-gradient(135deg,#9a54c6,#5a2b8a);
  --font:"Poppins","Century Gothic",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  /* Shared neutrals, identical across the design system */
  --bg-app:#f4f5f7; --bg-panel:#fff; --bg-panel-2:#f6f7f9; --bg-card:#fff;
  --bg-sidebar:#2b0f42; --text-1:#161821; --text-2:#494c5a; --text-muted:#71748a;
  --text-on-dark:#f3f4f7; --text-on-dark-muted:#b6a3c8;
  --border:#dcdde5; --border-soft:#ecedf2; --input-bg:#fff; --input-border:#dfe0e8;
  --row-hover:#f5f5f9; --topbar-bg:rgba(255,255,255,.76);
  /* Status */
  --status-red:#e0455a; --status-red-bg:#fbdfe2; --status-red-fg:#c62a3d;
  --status-amber:#d98a2b; --status-amber-bg:#f7e3c4; --status-amber-fg:#a3661f;
  --status-green:#2f9e58; --status-green-bg:#d7f0de; --status-green-fg:#227a43;
  /* Scale */
  --radius-xs:8px; --radius-sm:12px; --radius-md:16px; --radius-lg:20px; --radius-xl:26px;
  --shadow-1:0 1px 2px rgba(20,20,30,.04),0 2px 8px rgba(20,20,30,.05);
  --shadow-2:0 4px 14px rgba(20,20,30,.08),0 12px 30px rgba(20,20,30,.07);
  --shadow-3:0 14px 36px rgba(20,20,30,.14),0 28px 64px rgba(20,20,30,.16);
  --ease:cubic-bezier(.2,.7,.2,1); --accent-glow:rgba(125,60,181,.15); --sidebar-w:246px;
  /* Legacy aliases, mapped onto the system so existing rules inherit it */
  --violet:var(--brand); --violet-dark:var(--brand-dark); --violet-mid:var(--brand-mid);
  --lilac:var(--brand-tint); --soft:var(--bg-panel-2); --panel:var(--bg-panel);
  --ink:var(--text-1); --muted:var(--text-muted); --line:var(--border-soft);
  --green:var(--status-green); --red:var(--status-red); --shadow:var(--shadow-1);
}

@media(max-width:580px){.contact-summary,.contact-behaviour{grid-template-columns:1fr}.contact-actions{flex-wrap:wrap}.contact-actions .row-remove{margin-left:0}.tool-fields{grid-template-columns:1fr}.life-pulse{grid-template-columns:1fr}.life-pulse button:last-child{grid-column:auto}.owed-summary{grid-template-columns:1fr}.owed-toolbar{align-items:flex-start;flex-direction:column}.owed-toolbar .filter-chips{width:100%}.loan-dates{grid-template-columns:1fr 1fr}.loan-actions{flex-wrap:wrap}.loan-actions .row-remove{margin-left:0}}

/* ---- Design-system component corrections ---- */
/* Typography: headings and figures share the interface font (Poppins), not Aptos. */
.heading h1,.balance-copy strong,.metric strong,.summary-totals strong,.calc-screen output{font-family:var(--font)}
.brand-fallback span,.wm{font-family:"Quicksand","Poppins",sans-serif}
/* Sidebar and nav */
.sidebar{box-shadow:none}
.nav button{border-radius:var(--radius-sm)}
.nav button.active:before{background:var(--brand-accent)}
.vault-note>span{color:var(--brand-accent)}
/* Buttons */
.primary,.secondary,.danger{border-radius:var(--radius-sm)}
.secondary:hover{border-color:var(--brand);background:var(--row-hover)}
.icon-btn{background:var(--bg-card);border:1px solid var(--border-soft);color:var(--text-2)}
.icon-btn:hover{border-color:var(--brand);color:var(--brand)}
/* Brand-tinted icon chips across the app */
.loan-person,.contact-top>span,.life-pulse button>i,.tool-head>span{background:var(--brand-tint);color:var(--brand-fg)}
.jack-launcher b{background:var(--gradient-brand)}
/* Progress and meters use the brand */
.progress i,.loan-progress i,.bar i b,.rule-results i{background:var(--brand)}
.rule-results>div:nth-child(2) i{background:var(--brand-accent)}
.rule-results>div:nth-child(3) i{background:var(--status-green)}
.budget-ring{background:conic-gradient(var(--brand) var(--percent),var(--border-soft) 0)}
.progress i{background:var(--gradient-brand)}
/* Inputs: brand focus ring from the system */
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3.5px var(--accent-glow)}
/* Login: dramatic dark radial like the rest of the system, card stays light */
.lock-page{background:radial-gradient(circle at 50% -10%,#2b0f42 0%,#0c0d12 62%)}
.lock-card{border-radius:var(--radius-lg);box-shadow:var(--shadow-3)}
.wizard-bg .wizard-card{border-radius:var(--radius-xl)}
/* Legibility for brand-coloured figures and active tabs in dark mode */
body.dark .text-btn,body.dark .filter-chips button.active,body.dark .segmented button.active,body.dark .owed-view-tabs button.active,body.dark .jack-suggest small{color:var(--brand-accent)}
/* Unify dark surfaces onto the system tokens */
body.dark .topbar,body.dark .balance,body.dark .metric,body.dark .budget-card,body.dark .upload,body.dark .secondary,body.dark .modal,body.dark .confirm,body.dark .wizard-card,body.dark .bill-summary div,body.dark .tool-card,body.dark .owed-summary>div,body.dark .owed-toolbar,body.dark .loan-card,body.dark .contact-summary>div,body.dark .contact-card,body.dark .owed-view-tabs button.active,body.dark .tip,body.dark .jack-panel,body.dark .jack-bubble,body.dark .jack-suggest button,body.dark .jack-composer input,body.dark .jack-chip,body.dark .jack-action,body.dark .segmented button.active,body.dark .life-pulse button{background:var(--bg-panel)}
body.dark .search,body.dark .table-toolbar,body.dark .bill-head,body.dark .summary-totals div,body.dark .deduction,body.dark .payday-chip,body.dark .field input,body.dark .field select,body.dark .field textarea,body.dark .jack-bubble.me,body.dark .segmented,body.dark .data-stats div,body.dark .tool-fields input,body.dark .tool-income input,body.dark .tool-result,body.dark .rule-results>div,body.dark .repay-balance,body.dark .history-original,body.dark .modal-note,body.dark .contact-money{background:var(--bg-panel-2)}
body.dark .loan-person,body.dark .contact-top>span,body.dark .life-pulse button>i,body.dark .tool-head>span{background:var(--brand-tint);color:var(--brand-fg)}

/* ---- Readability and ease of use ----
   Larger, calmer text needs a little more room to breathe, so the fixed
   column widths, tap targets and dense rows are relaxed to match. */
/* Give the wider text room in fixed grids */
.bill-head,.bill-row{grid-template-columns:minmax(210px,1fr) 130px 100px 108px 34px;gap:12px}
.bar{grid-template-columns:110px 1fr 88px}
.transaction{grid-template-columns:44px minmax(0,1fr) auto 32px 32px}
.doc-row{grid-template-columns:44px minmax(0,1fr) auto 32px}
.repayment-row{grid-template-columns:minmax(0,1fr) auto 32px}
/* Comfortable tap targets, 32px minimum for small row controls */
.row-remove,.row-edit{width:32px;height:32px;border-radius:9px}
.modal-head button{width:34px;height:34px}
.bill-paid{padding:8px 12px}
.loan-actions .primary,.loan-actions .secondary,.contact-actions .primary,.contact-actions .secondary{min-height:38px;padding:0 13px}
/* Small print stays legible: looser lines, calmer tracking */
.life-pulse small,.owed-summary small,.contact-behaviour small,.loan-dates small,.wizard-summary small,.tool-result small,.profile-meta small{letter-spacing:.04em;line-height:1.45}
.brand-fallback small{letter-spacing:.22em}
.transaction small,.doc-row small,.bill-row small,.loan-top p,.contact-top p{line-height:1.5}
.tool-disclaimer,.import-hint,.pay-source{line-height:1.6}
/* Uppercase micro labels read better with a touch more weight and space */
.life-pulse small,.balance-copy span,.metric small{text-transform:none;letter-spacing:.01em;font-weight:700}
/* Nav and sidebar: clearer icons and comfortable rows */
.nav button{padding:11px 14px}
.nav button i{width:20px;font-size:18px}
.vault-note{padding:12px 13px}
/* Denser tables get a little more vertical room */
.bill-row{padding:14px 18px}
.transaction{padding:13px 2px}
.preference,.pref-group,.annual-row{padding-top:14px;padding-bottom:14px}
/* Empty states are friendlier at a readable size */
.empty p{font-size:13px}.empty span{font-size:26px}
/* Toast and tooltips */
.toast{font-size:13px;padding:13px 18px}

/* The Ask Jack launcher is pinned bottom right, so lift notices clear of it
   instead of letting the launcher sit on top of the message. */
.toast{right:20px;bottom:82px;z-index:420;max-width:min(380px,calc(100vw - 40px));line-height:1.5}
@media(max-width:520px){.toast{right:12px;left:12px;bottom:74px;max-width:none}}

/* ---- Menu for narrow screens ----
   Below 580px the sidebar was hidden with nothing to replace it, which left
   no way to move between pages. It now slides in from a menu button. */
.nav-toggle{display:none;width:40px;height:40px;margin-right:auto;border:1px solid var(--border-soft);border-radius:10px;background:var(--bg-card);color:var(--text-1);font-size:18px;line-height:1}
.nav-toggle:hover{border-color:var(--brand);color:var(--brand)}
.nav-scrim[hidden]{display:none}
@media(max-width:580px){
  .nav-toggle{display:grid;place-items:center}
  .sidebar{display:flex;position:fixed;inset:0 auto 0 0;z-index:300;width:min(272px,82vw);padding:18px 12px 12px;transform:translateX(-100%);transition:transform .22s var(--ease);box-shadow:none}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(15,6,22,.4)}
  .sidebar .brand{display:flex;height:auto;min-height:0;margin-bottom:8px}
  .sidebar .brand img{width:130px;height:52px;object-fit:contain;object-position:center}
  .nav-title,.nav button span,.vault-note div{display:revert}
  .nav button{justify-content:flex-start;padding:12px 14px}
  .nav-scrim{position:fixed;inset:0;z-index:290;background:rgba(18,8,24,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
}
@media(prefers-reduced-motion:reduce){.sidebar{transition:none}}

/* Shown only when the browser refuses to store data, so a person is never
   told their money records are safe when they are not. */
.storage-banner{position:fixed;z-index:600;left:50%;top:14px;transform:translateX(-50%);width:min(620px,calc(100vw - 24px));display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;padding:13px 46px 13px 16px;border:1px solid var(--status-amber);border-radius:var(--radius-md);background:var(--status-amber-bg);color:var(--status-amber-fg);box-shadow:var(--shadow-3);font-size:12.5px;line-height:1.5}
.storage-banner b{font-size:13px;color:inherit}
.storage-banner button{position:absolute;top:8px;right:9px;width:30px;height:30px;border-radius:8px;background:transparent;color:inherit;font-size:17px;line-height:1}
.storage-banner button:hover{background:rgba(0,0,0,.08)}
</style>

<script>
(()=>{'use strict';
const KEY='amethyst-money-v1', PIN='amethyst-money-pin-v1', THEME='amethyst-money-theme', PREF='amethyst-money-prefs-v1';
const sections=[['Overview','⌂'],['Transactions','↕'],['Budgets','◎'],['Bills & reminders','◷'],['Owed to you','⇢'],['You owe','⇠'],['Payday & tax','£'],['Documents',''],['Reports','▤'],['Calculator','＋'],['Money tools','◇'],['Settings','⚙']];
const copy={Overview:['Overview','Here’s how your money is looking today.'],Transactions:['Transactions','Every incoming and outgoing, all in one place.'],Budgets:['Budgets','Give every category a comfortable limit.'],'Bills & reminders':['Bills & reminders','See what is due before it surprises you.'],'Owed to you':['Owed to you','Keep track of money you lend and every repayment.'],'You owe':['You owe','Manage money you need to repay to other people.'],'Payday & tax':['Payday & tax','Plan each payday and understand where your salary goes.'],Documents:['Document vault','Keep statements, receipts and policies together.'],Reports:['Reports & exports','Turn your records into something useful.'],Calculator:['Calculator','Quick sums without leaving your money workspace.'],'Money tools':['Money tools','Useful answers for everyday money decisions.'],Settings:['Settings','Manage your local vault and backups.']};
const cats=['Housing','Groceries','Transport','Eating out','Shopping','Bills','Subscriptions','Health','Entertainment','Salary','Savings','Other'];
let state=load(), prefs=loadPrefs(), section='Overview', calc='', unlocked=false, jackHistory=[], jackSuggestIndex=-1, jackPending={}, jackUndo=null, onboardingStep=0, onboardingDraft={}, transactionFilter='all', loanFilter='open', debtFilter='open', owedView='loans';
function localDay(d){const t=d instanceof Date?d:new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
function vaultShape(){return{version:5,transactions:[],budgets:[],bills:[],loans:[],debts:[],contacts:[],payroll:payrollDefaults(),profile:profileDefaults()}}
function isObj(x){return !!x&&typeof x==='object'&&!Array.isArray(x)}
function vStr(v,fallback){return typeof v==='string'?v:(v==null?(fallback||''):String(v))}
function vNum(v){const n=Number(v);return Number.isFinite(n)?n:0}
function vId(){return 'r-'+Date.now().toString(36)+Math.random().toString(36).slice(2)}
function vDate(v){const s=vStr(v);return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:localDay()}
function vList(src,key){return Array.isArray(src[key])?src[key].filter(isObj):[]}
/* Rebuilds a vault from anything: saved data, a restored file, another
   version. Never throws, and never lets one bad record blank the app. */
function sanitiseVault(raw){const src=isObj(raw)?raw:{};const out=Object.assign(vaultShape(),src);out.version=5;
 out.transactions=vList(src,'transactions').map(t=>Object.assign({},t,{id:vStr(t.id)||vId(),kind:t.kind==='income'?'income':'expense',date:vDate(t.date),description:vStr(t.description,'Untitled'),category:vStr(t.category,'Other'),amount:Math.round(vNum(t.amount)),notes:vStr(t.notes)}));
 out.budgets=vList(src,'budgets').map(b=>Object.assign({},b,{category:vStr(b.category,'Other'),limit:Math.round(vNum(b.limit))}));
 out.bills=vList(src,'bills').map(b=>Object.assign({},b,{id:vStr(b.id)||vId(),name:vStr(b.name,'Untitled bill'),category:vStr(b.category,'Other'),amount:Math.round(vNum(b.amount)),dueDay:Math.min(31,Math.max(1,Math.round(vNum(b.dueDay))||1))}));
 const rep=l=>Array.isArray(l.repayments)?l.repayments.filter(isObj).map(r=>Object.assign({},r,{id:vStr(r.id)||vId(),date:vDate(r.date),amount:Math.round(vNum(r.amount))})):[];
 out.loans=vList(src,'loans').map(l=>Object.assign({},l,{id:vStr(l.id)||vId(),person:vStr(l.person,'Unknown'),reason:vStr(l.reason),amount:Math.round(vNum(l.amount)),lentDate:vDate(l.lentDate),dueDate:vStr(l.dueDate),repayments:rep(l)}));
 out.debts=vList(src,'debts').map(d=>Object.assign({},d,{id:vStr(d.id)||vId(),person:vStr(d.person,'Unknown'),reason:vStr(d.reason),amount:Math.round(vNum(d.amount)),borrowedDate:vDate(d.borrowedDate),dueDate:vStr(d.dueDate),repayments:rep(d)}));
 out.contacts=vList(src,'contacts').map(c=>Object.assign({},c,{id:vStr(c.id)||vId(),name:vStr(c.name,'Unknown'),phone:vStr(c.phone),email:vStr(c.email),notes:vStr(c.notes)}));
 out.payroll=Object.assign(payrollDefaults(),isObj(src.payroll)?src.payroll:{});
 out.profile=Object.assign(profileDefaults(),isObj(src.profile)?src.profile:{});
 try{return normaliseContacts(out)}catch(err){out.contacts=[];return out}}
function payrollDefaults(){return{salary:0,bonus:0,frequency:'monthly',payday:new Date().toISOString().slice(0,10),region:'rUK',taxCode:'1257L',pensionRate:0,pensionType:'none',studentPlan:'none',postgraduate:false,niCategory:'A'}}
function profileDefaults(){return{name:'',setupComplete:false,createdAt:'',lastBackup:''}}
function normaliseContacts(data){data.contacts=Array.isArray(data.contacts)?data.contacts:[];(data.loans||[]).forEach((l,i)=>{let c=l.contactId&&data.contacts.find(x=>x.id===l.contactId);if(!c)c=data.contacts.find(x=>String(x&&x.name||'').toLowerCase()===String(l.person||'').toLowerCase());if(!c){c={id:`contact-${l.id||i}-${Date.now()}`,name:l.person||'Unknown',phone:'',email:'',notes:'',createdAt:new Date().toISOString()};data.contacts.push(c)}l.contactId=c.id;l.person=c.name});return data}
function load(){try{return sanitiseVault(JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(err){return vaultShape()}}
function loadPrefs(){try{return Object.assign({theme:'system',density:'comfortable',textSize:'standard',autoLock:5,jack:true,jackInsights:true},JSON.parse(localStorage.getItem(PREF)||'{}'))}catch{return{theme:'system',density:'comfortable',textSize:'standard',autoLock:5,jack:true,jackInsights:true}}}
function storageWarn(){var el=document.getElementById('storageBanner');if(!el){el=document.createElement('div');el.id='storageBanner';el.className='storage-banner';el.setAttribute('role','alert');el.innerHTML='<b>Your changes are not being saved.</b><span>This browser will not let Amethyst store data, so anything you add now will be lost when you close this tab. Download a backup from Settings to keep it.</span>';var x=document.createElement('button');x.type='button';x.setAttribute('aria-label','Dismiss');x.textContent='\u00d7';x.onclick=function(){el.remove()};el.appendChild(x);document.body.appendChild(el);}}function storageSet(key,value,silent){try{localStorage.setItem(key,value);return true}catch(err){if(!silent)storageWarn();return false}}function storageRemove(key){try{localStorage.removeItem(key)}catch(err){}}function save(){return storageSet(KEY,JSON.stringify(state))}
const $=s=>document.querySelector(s), money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(n/100), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), id=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2), iso=d=>localDay(d), month=()=>iso().slice(0,7);
function flash(message){const el=$('#toast');el.textContent='◆ '+message;el.classList.remove('hidden');clearTimeout(flash.timer);flash.timer=setTimeout(()=>el.classList.add('hidden'),2500)}
function bytes64(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s)} function from64(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function pinHash(value,salt){const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(value),'PBKDF2',false,['deriveBits']);return bytes64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:from64(salt),iterations:120000,hash:'SHA-256'},key,256)))}
async function start(){const stored=JSON.parse(localStorage.getItem(PIN)||'null');if(stored){$('#lockKicker').textContent='WELCOME BACK';$('#lockTitle').textContent='Enter your PIN';$('#lockCopy').textContent='Unlock your private money workspace.';$('#pinSubmit').textContent='Unlock vault'}$('#pin').focus();$('#pinSubmit').onclick=submitPin;$('#pin').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'');$('#pin').onkeydown=e=>{if(e.key==='Enter')submitPin()};}
async function submitPin(){const value=$('#pin').value;if(!/^\d{4}$/.test(value)){return $('#pinError').textContent='Enter exactly four digits.'}const stored=JSON.parse(localStorage.getItem(PIN)||'null');if(!stored){const salt=bytes64(crypto.getRandomValues(new Uint8Array(16)));if(!storageSet(PIN,JSON.stringify({salt,hash:await pinHash(value,salt)})))return void($('#pinError').textContent='This browser will not let Amethyst save your PIN. Check that site data is allowed, then try again.')}else if(await pinHash(value,stored.salt)!==stored.hash){$('#pinError').textContent='That PIN is not correct.';$('#pin').value='';return}$('#pin').value='';$('#pinError').textContent='';unlock()}
function unlock(){unlocked=true;$('#lock').classList.add('hidden');$('#app').classList.remove('hidden');applyPrefs();renderNav();render();jackWelcome();if(!state.profile.setupComplete)setTimeout(openOnboarding,120);document.addEventListener('visibilitychange',autoLock);['mousedown','keydown','touchstart','wheel'].forEach(ev=>document.addEventListener(ev,()=>{if(unlocked)autoLock()},{passive:true}))}
function lock(){unlocked=false;$('#app').classList.add('hidden');$('#lock').classList.remove('hidden');$('#modalRoot').innerHTML='';$('#onboardingRoot').innerHTML='';$('#jackPanel').classList.remove('open');$('#jackLauncher').classList.add('hidden');$('#lockKicker').textContent='WELCOME BACK';$('#lockTitle').textContent='Enter your PIN';$('#lockCopy').textContent='Unlock your private money workspace.';$('#pinSubmit').textContent='Unlock vault';$('#pin').focus()}

function renderNav(){$('#nav').innerHTML='<p class="nav-title">YOUR MONEY</p>'+sections.slice(0,9).map(n=>navButton(n)).join('')+'<p class="nav-title">TOOLS</p>'+sections.slice(9).map(n=>navButton(n)).join('');$('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{section=b.dataset.page;renderNav();render()})}
function navButton([name,icon]){return `<button data-page="${esc(name)}" class="${esc(section===name?'active':'')}"><i>${icon}</i><span>${name}</span></button>`}

function daysUntilDue(dueDay){const now=new Date(),y=now.getFullYear(),m=now.getMonth(),d=now.getDate();const day=Math.min(31,Math.max(1,Math.round(Number(dueDay))||1));const at=(yy,mm)=>{const last=new Date(yy,mm+1,0).getDate();return new Date(yy,mm,Math.min(day,last))};const start=new Date(y,m,d);let t=at(y,m);if(t<start)t=at(m===11?y+1:y,(m+1)%12);return Math.round((t-start)/86400000)}

on':'people'}.`;const income=toolValue('ruleIncome');$('#ruleNeeds').textContent=money(Math.round(income*50));$('#ruleWants').textContent=money(Math.round(income*30));$('#ruleSavings').textContent=money(Math.round(income*20))}

function openContactModal(contactId=''){const c=state.contacts.find(x=>x.id===contactId);$('#modalRoot').innerHTML=`<div class="modal-bg"><form id="contactForm" class="modal"><div class="modal-head"><div><p>OWED TO YOU</p><h2>${c?'Edit contact':'Add a contact'}</h2></div><button type="button" id="closeModal">×</button></div><label class="field">Name<input name="name" value="${esc(c?.name||'')}" maxlength="60" required autofocus></label><div class="two"><label class="field">Phone<input name="phone" type="tel" value="${esc(c?.phone||'')}" placeholder="Optional"></label><label class="field">Email<input name="email" type="email" value="${esc(c?.email||'')}" placeholder="Optional"></label></div><label class="field">Notes<textarea name="notes" rows="3" placeholder="Anything useful to remember">${esc(c?.notes||'')}</textarea></label><div class="modal-note">Repayment timing is calculated automatically from this person’s linked lending history.</div><div class="modal-actions"><button type="button" class="secondary" id="cancelModal">Cancel</button><button class="primary">Save contact</button></div></form></div>`;$('#closeModal').onclick=$('#cancelModal').onclick=closeModal;$('#contactForm').onsubmit=e=>saveContact(e,contactId)}
function saveContact(e,contactId){e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),name=v.name.trim(),duplicate=state.contacts.find(c=>c.id!==contactId&&c.name.toLowerCase()===name.toLowerCase());if(duplicate)return flash('A contact with that name already exists');let c=state.contacts.find(x=>x.id===contactId);if(c){const oldName=c.name;Object.assign(c,{name,phone:String(v.phone||'').trim(),email:String(v.email||'').trim(),notes:String(v.notes||'').trim()});state.loans.filter(l=>l.contactId===c.id).forEach(l=>{l.person=name;const original=state.transactions.find(t=>String(t.notes||'').startsWith(`Lending record:${l.id}`));if(original)original.description=`Lent to ${name}`;(l.repayments||[]).forEach(r=>{const tx=state.transactions.find(t=>String(t.notes||'').startsWith(`Loan repayment:${l.id}:${r.id}`));if(tx)tx.description=`Repayment from ${name}`})})}else{c={id:id(),name,phone:String(v.phone||'').trim(),email:String(v.email||'').trim(),notes:String(v.notes||'').trim(),createdAt:new Date().toISOString()};state.contacts.push(c)}save();closeModal();render();flash(contactId?'Contact updated':'Contact added')}

function saveLoan(e){e.preventDefault();const form=e.target,v=Object.fromEntries(new FormData(form));if(v.dueDate&&v.dueDate<v.lentDate)return flash('The repayment date cannot be before the lending date');let contact=form.dataset.contactId&&state.contacts.find(c=>c.id===form.dataset.contactId);if(!contact)contact=state.contacts.find(c=>c.name.toLowerCase()===v.person.trim().toLowerCase());if(!contact){contact={id:id(),name:v.person.trim(),phone:'',email:'',notes:'',createdAt:new Date().toISOString()};state.contacts.push(contact)}const amount=Math.round(Number(v.amount)*100),loan={id:id(),contactId:contact.id,person:contact.name,reason:String(v.reason||'').trim(),amount,lentDate:v.lentDate,dueDate:v.dueDate||'',repayments:[],createdAt:new Date().toISOString()};state.loans.push(loan);if(form.elements.recordOutgoing.checked)state.transactions.push({id:id(),kind:'expense',date:loan.lentDate,description:`Lent to ${loan.person}`,category:'Other',amount,notes:`Lending record:${loan.id}${loan.reason?' · '+loan.reason:''}`});save();closeModal();render();flash(`Money lent to ${loan.person} recorded`)}

function saveEditedLoan(e,loanId){e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),l=state.loans.find(x=>x.id===loanId);if(!l)return;if(v.dueDate&&v.dueDate<v.lentDate)return flash('The repayment date cannot be before the lending date');const wanted=String(v.person||'').trim(),wasName=l.person;let contact=state.contacts.find(c=>c.id===l.contactId);if(contact&&contact.name.toLowerCase()!==wanted.toLowerCase()){const clash=state.contacts.find(c=>c.id!==contact.id&&c.name.toLowerCase()===wanted.toLowerCase());if(clash){contact=clash}else{contact.name=wanted;state.loans.forEach(x=>{if(x.contactId===contact.id)x.person=wanted});state.transactions.forEach(t=>{if(t.description===`Repayment from ${wasName}`)t.description=`Repayment from ${wanted}`;if(t.description===`Lent to ${wasName}`)t.description=`Lent to ${wanted}`})}}if(!contact)contact=state.contacts.find(c=>c.name.toLowerCase()===wanted.toLowerCase());if(!contact){contact={id:id(),name:wanted,phone:'',email:'',notes:'',createdAt:new Date().toISOString()};state.contacts.push(contact)}Object.assign(l,{contactId:contact.id,person:contact.name,reason:String(v.reason||'').trim(),lentDate:v.lentDate,dueDate:v.dueDate||''});const linked=state.transactions.find(t=>String(t.notes||'').startsWith(`Lending record:${l.id}`));if(linked){linked.date=l.lentDate;linked.description=`Lent to ${l.person}`;linked.notes=`Lending record:${l.id}${l.reason?' · '+l.reason:''}`}save();closeModal();render();flash('Lending details updated')}

function calculate(expr){const source=expr.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/\s/g,''),tokens=source.match(/\d+(?:\.\d+)?|[()+\-*/]/g)||[];if(!source||tokens.join('')!==source)throw 0;let i=0;function factor(){const t=tokens[i++];if(t==='('){const v=sum();if(tokens[i++]!==')')throw 0;return v}if(t==='-')return-factor();const v=Number(t);if(!Number.isFinite(v))throw 0;return v}function product(){let v=factor();while(tokens[i]==='*'||tokens[i]==='/'){const op=tokens[i++],n=factor();v=op==='*'?v*n:v/n}return v}function sum(){let v=product();while(tokens[i]==='+'||tokens[i]==='-'){const op=tokens[i++],n=product();v=op==='+'?v+n:v-n}return v}const r=sum();if(i!==tokens.length||!Number.isFinite(r))throw 0;return Math.round(r*1e10)/1e10}

function parseCsv(text){const rows=[],row=[];let field='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i],next=text[i+1];if(c==='"'&&quoted&&next==='"'){field+='"';i++}else if(c==='"')quoted=!quoted;else if(c===','&&!quoted){row.push(field.trim());field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&next==='\n')i++;row.push(field.trim());field='';if(row.some(Boolean))rows.push(row.splice(0));else row.length=0;}else field+=c}if(field||row.length){row.push(field.trim());rows.push(row)}return rows}

function applyPrefs(){const dark=prefs.theme==='dark'||(prefs.theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.body.classList.toggle('dark',dark);document.body.classList.toggle('compact',prefs.density==='compact');document.body.classList.toggle('text-large',prefs.textSize==='large');storageSet(THEME,dark?'dark':'light',true);const ask=$('#askJack'),launcher=$('#jackLauncher'),panel=$('#jackPanel');if(ask)ask.classList.toggle('hidden',!prefs.jack);if(panel&&!prefs.jack)panel.classList.remove('open');if(launcher)launcher.classList.toggle('hidden',!unlocked||!prefs.jack||panel.classList.contains('open'))}

function jackWelcome(){if(jackHistory.length)return jackRender();const t=totals(),net=t.income-t.expenses,hello=state.profile.name?`Hi ${esc(state.profile.name)},`:'Hello,',insight=prefs.jackInsights?(state.transactions.length?` This month you are <b>${net>=0?money(net)+' ahead':money(Math.abs(net))+' behind'}</b>.`:' Add an incoming or outgoing and I’ll start finding useful patterns.') :'';jackHistory=[{role:'jack',html:`${hello} I’m <b>Jack</b>, your private money assistant.${insight}<br><br>I can explain your spending, calculate payday deductions, find bills, navigate the vault and carry out common actions.`}];jackRender()}
function jackRender(){const body=$('#jackBody');if(!body)return;body.innerHTML=jackHistory.map(x=>`<div class="jack-bubble ${x.role==='me'?'me':''}">${x.role==='me'?esc(x.html):x.html}${x.actions?`<div class="jack-actions">${x.actions.map(a=>`<button class="jack-action" data-jack-action="${esc(a.action)}">${esc(a.label)}</button>`).join('')}</div>`:''}</div>`).join('');body.querySelectorAll('[data-jack-action]').forEach(b=>b.onclick=()=>jackRunAction(b.dataset.jackAction));body.scrollTop=body.scrollHeight;const chips=$('#jackChips');chips.innerHTML=['My balance','Money owed','I owe','Next bill','Take-home pay'].map(q=>`<button class="jack-chip">${q}</button>`).join('');chips.querySelectorAll('button').forEach(b=>b.onclick=()=>jackAsk(b.textContent))}

<script>
/* Menu for narrow screens. Kept separate from the app so a failure here can
   never stop the rest of the page working. */
(function(){
  var btn=document.getElementById('navToggle'),
      scrim=document.getElementById('navScrim'),
      bar=document.querySelector('.sidebar'),
      nav=document.getElementById('nav');
  if(!btn||!bar) return;
  function set(open){
    bar.classList.toggle('open',open);
    if(scrim) scrim.hidden=!open;
    btn.setAttribute('aria-expanded',open?'true':'false');
    btn.setAttribute('aria-label',open?'Close menu':'Open menu');
  }
  btn.addEventListener('click',function(){ set(!bar.classList.contains('open')); });
  if(scrim) scrim.addEventListener('click',function(){ set(false); });
  if(nav) nav.addEventListener('click',function(e){ if(e.target.closest('button')) set(false); });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') set(false); });
  window.addEventListener('resize',function(){ if(window.innerWidth>580) set(false); });
})();
</script>
<script>
/* Dialog behaviour people expect: Escape closes, clicking the dark area
   closes, and the first field is ready to type in. Kept standalone so a
   failure here cannot stop the rest of the page working. The setup wizard
   is deliberately excluded, it has its own Skip. */
(function(){
  var root=document.getElementById('modalRoot');
  if(!root) return;
  var open=function(){return root.innerHTML.trim().length>0;};
  var shut=function(){ if(open()) root.innerHTML=''; };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') shut(); });
  root.addEventListener('mousedown',function(e){
    if(e.target===e.currentTarget) return shut();
    if(e.target.classList&&(e.target.classList.contains('modal-bg')||e.target.classList.contains('confirm-bg'))) shut();
  });
  // Focus the first useful field whenever a dialog appears.
  try{
    new MutationObserver(function(){
      if(!open()) return;
      var el=root.querySelector('input:not([type=hidden]):not([disabled]),select,textarea');
      if(!el) el=root.querySelector('button');
      if(el&&document.activeElement!==el){ try{ el.focus({preventScroll:false}); }catch(err){} }
    }).observe(root,{childList:true});
  }catch(err){}
})();
</script>
